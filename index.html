}
function checkWalkOff() {
  if (G.half === 1 && G.inning >= G.innings && G.runs[1] > G.runs[0]) {
    G.play = null;
    gameOver(true);
    return true;
  }
  return false;
}
function endHalf() {
  G.state = 'halfend'; G.stateT = 0;
  if (G.line[G.half][G.inning - 1] === undefined) G.line[G.half][G.inning - 1] = 0;
  UI.updateBoard(G);
  UI.bigBanner('¡TRES OUTS!', 'Cambio de lado', { ms: 1500, cls: 'white' });
  SFX.pito(); SFX.crowd(0.4, 1.5);
  UI.setRoles(G, 'pitch');
}
function advanceHalf() {
  // ¿fin del juego?
  const last = G.inning >= G.innings;
  if (G.half === 0 && last && G.runs[1] > G.runs[0]) return gameOver(false);
  if (G.half === 1 && last && G.runs[0] !== G.runs[1]) return gameOver(false);
  if (G.half === 1 && G.inning >= G.innings + 3 && G.runs[0] === G.runs[1]) return gameOver(false, true);
  if (G.half === 0) G.half = 1; else { G.half = 0; G.inning++; }
  G.outs = 0; G.balls = 0; G.strikes = 0;
  G.line[G.half][G.inning - 1] = 0;
  // apaga runners viejos
  for (const T of G.teams) { T.captain.lookTarget = null; T.mates.forEach((m) => { m.onBench = false; m.lookTarget = null; }); }
  setupHalf();
  UI.updateBoard(G);
  G.camMode = 'bat'; snapCamera();
  announceHalf(false);
}

// ---------- fin del juego ----------
function gameOver(walkoff, tie) {
  G.state = 'gameover'; G.stateT = 0;
  const w = G.runs[0] > G.runs[1] ? 0 : G.runs[1] > G.runs[0] ? 1 : -1;
  G.winner = w;
  const wn = w >= 0 ? G.players[w].name : '';
  UI.bigBanner(tie ? '¡EMPATE!' : walkoff ? '¡LO DEJÓ EN EL TERRENO!' : `¡GANÓ ${wn.toUpperCase()}!`, tie ? 'Nadie se llevó la chapa' : `${G.runs[0]} - ${G.runs[1]}`, { burst: true, ms: 3200 });
  SFX.jonron(); SFX.say(tie ? 'Empate' : `¡Ganó ${wn}!`);
  if (w >= 0) {
    const T = G.teams[w];
    T.captain.setAnim('cheer', {}); T.mates.forEach((m) => m.setAnim('dance', {}));
    const L = G.teams[1 - w]; L.captain.setAnim('sad'); L.mates.forEach((m) => m.setAnim('sad'));
  }
  for (let i = 0; i < 6; i++) later(i * 0.4, () => FX.confetti.burst(new V3(rand(-8, 8), 6, rand(-14, 0)), 80, 6, 8));
  const cols = [0xff4a6a, 0xffd23f, 0x4ad1ff, 0x7dff6a];
  for (let i = 0; i < 12; i++) later(i * 0.3, () => { const a = rand(-1, 1), R = rand(35, 55); FX.rocket(new V3(Math.sin(a) * R, 0, -Math.cos(a) * R), new V3(Math.sin(a) * R, rand(18, 30), -Math.cos(a) * R), pick(cols)); });
  const s = G.env.crowd; if (s) { s.excite = 1; s.wave = 0; }
  G.camMode = 'end';
  UI.show($('roles'), false);
  later(3.4, showEndScreen);
}

const CAM = { pos: new V3(0, 6, 20), look: new V3(0, 1, -10), fov: 50, tpos: new V3(), tlook: new V3(), tfov: 50, k: 4, orbit: 0 };
function computeCamTarget(dt) {
  const m = G.camMode;
  CAM.k = 4;
  if (m === 'menu') {
    CAM.orbit += dt * 0.06;
    const a = CAM.orbit, big = !!(G.env && G.env.standH);
    const R = big ? 20 : 24;
    CAM.tpos.set(Math.sin(a) * R, (big ? 4.6 : 3.6) + Math.sin(a * 0.7) * 1.2, (big ? -15 : -14) + Math.cos(a) * R);
    CAM.tlook.set(0, big ? 5.5 : 4.2, -16); CAM.tfov = big ? 56 : 52; CAM.k = 2;
  } else if (m === 'select') {
    CAM.tpos.set(0, 0.95, -2.3); CAM.tlook.set(0, 0.25, -6.6); CAM.tfov = 46; CAM.k = 3;
  } else if (m === 'bat') {
    const sway = Math.sin(G.t * 0.6) * 0.06;
    CAM.tpos.set(1.25 + sway, 2.3, 5.0); CAM.tlook.set(0.0, 1.0, -8); CAM.tfov = 46;
    if (G.state === 'windup') { CAM.tfov = 43; CAM.tpos.z = 4.75; }
    if (G.state === 'flight') { CAM.tfov = 45; }
    CAM.k = 5;
  } else if (m === 'play' && G.play && G.play.ball) {
    const play = G.play, ball = CHAPA.position;
    let focus = ball.clone();
    if (play.chaser && play.ball.state === 'flight') focus.lerp(play.chaser.char.root.position, 0.4);
    if (play.ball.state === 'thrown' && play.ball.thr) { focus.lerp(basePos(play.ball.thr.base), 0.3); }
    if (play.ball.state === 'held' || play.ball.state === 'dead') {
      const lead = play.runners.find((r) => r.state === 'run');
      if (lead) focus.lerp(lead.char.root.position, 0.5);
    }
    focus.y = clamp(ball.y * 0.4, 0.8, 6);
    const d = Math.hypot(focus.x, focus.z);
    CAM.tpos.set(focus.x * 0.6, 4.2 + d * 0.15 + ball.y * 0.35, focus.z + 10 + d * 0.28);
    CAM.tlook.copy(focus); CAM.tlook.y += 0.6; CAM.tfov = 54; CAM.k = 3.2;
    if (G.closeCam) {
      G.closeCam.t += dt;
      const bp = basePos(G.closeCam.base);
      CAM.tpos.set(bp.x + 2.6 * Math.sign(bp.x || 1), 1.7, bp.z + 3.6); CAM.tlook.set(bp.x, 0.7, bp.z); CAM.tfov = 40; CAM.k = 7;
      if (G.closeCam.t > 0.9) G.closeCam = null;
    }
  } else if (m === 'hr' && G.play) {
    G.hrT += dt;
    const ball = CHAPA.position;
    if (G.hrT < 2.0 && CHAPA.visible) {
      const dir = new V3(ball.x, 0, ball.z).normalize();
      CAM.tpos.set(ball.x - dir.x * 7 + 2.5, ball.y + 2.2, ball.z - dir.z * 7 + 2);
      CAM.tlook.copy(ball); CAM.tfov = 55; CAM.k = 5;
    } else {
      const b = batter().root.position;
      CAM.tpos.set(b.x + 9, 4.5, b.z + 9); CAM.tlook.set(b.x, 1.2, b.z); CAM.tfov = 46; CAM.k = 2.5;
    }
  } else if (m === 'foul' && G.play) {
    CAM.tpos.set(0.95, 2.2, 5.2); CAM.tlook.copy(CHAPA.position).lerp(new V3(0, 1, -6), 0.4); CAM.tfov = 50; CAM.k = 3;
  } else if (m === 'steal') {
    const lead = G.play && G.play.runners.find((r) => r.state === 'run');
    const t = lead ? lead.char.root.position : basePos(2);
    CAM.tpos.set(t.x * 0.6, 7, t.z + 12); CAM.tlook.set(t.x, 0.8, t.z); CAM.tfov = 46; CAM.k = 3;
  } else if (m === 'end') {
    CAM.orbit += dt * 0.15;
    CAM.tpos.set(Math.sin(CAM.orbit) * 14, 6, -6 + Math.cos(CAM.orbit) * 14); CAM.tlook.set(0, 1.2, -6); CAM.tfov = 50; CAM.k = 2;
  }
}
// en el estadio la cámara nunca se mete dentro de las gradas
function keepCamOutOfStands(p) {
  const sh = G.env && G.env.standH; if (!sh) return;
  for (let i = 0; i < 40; i++) { const h = sh(p.x, p.z); if (h <= 0 || p.y > h + 1.8) break; p.x *= 0.95; p.z = (p.z + 12) * 0.95 - 12; }
}
function snapCamera() { computeCamTarget(0); keepCamOutOfStands(CAM.tpos); CAM.pos.copy(CAM.tpos); CAM.look.copy(CAM.tlook); CAM.fov = CAM.tfov; }
function updateCamera(dt, realDt) {
  computeCamTarget(dt);
  keepCamOutOfStands(CAM.tpos);
  const k = 1 - Math.exp(-CAM.k * Math.max(dt, realDt * 0.15));
  CAM.pos.lerp(CAM.tpos, k); CAM.look.lerp(CAM.tlook, k); CAM.fov = lerp(CAM.fov, CAM.tfov, k);
  camera.position.copy(CAM.pos); camera.lookAt(CAM.look);
  const so = shakeOffset(Clock.real);
  camera.translateX(so.x); camera.translateY(so.y); camera.translateZ(so.z); camera.rotateZ(so.r);
  const f = CAM.fov + Juice.fovKick;
  if (Math.abs(camera.fov - f) > 0.01) { camera.fov = f; camera.updateProjectionMatrix(); }
}

// ===================== ACTUALIZACIÓN DE ESTADOS =====================
function cpuChoosePitch() {
  const D = DIFF[G.difficulty];
  const last = G.lastPitches || [];
  let w = { recta: 0.4, curva: 0.33, rapida: 0.27 };
  if (Math.random() < D.pitchSmart) {
    if (G.balls >= 3) w = { recta: 0.65, curva: 0.2, rapida: 0.15 };
    else if (G.strikes >= 2) w = { recta: 0.2, curva: 0.4, rapida: 0.4 };
    if (last.length >= 2 && last[0] === last[1]) w[last[0]] *= 0.25;
  }
  const tot = w.recta + w.curva + w.rapida; let r = Math.random() * tot;
  for (const k of ['recta', 'curva', 'rapida']) { r -= w[k]; if (r <= 0) return k; }
  return 'recta';
}
function updateGame(dt) {
  if (G.paused) return;
  switch (G.state) {
    case 'intro':
      G.stateT += dt;
      if (G.stateT > 2.2 || (G.stateT > 0.6 && (pk(0, 'up') || pk(1, 'up') || kp('Enter')))) { UI.clearBanner(); toPrePitch(); }
      break;
    case 'prepitch': {
      G.stateT += dt;
      if (!offPlayer().cpu && pk(G.half, 'down')) callSteal();
      let type = null;
      const di = 1 - G.half;
      if (defPlayer().cpu) { if (G.stateT > G.cpuPitchAt) type = cpuChoosePitch(); }
      else if (G.stateT > 0.25) { if (pk(di, 'left')) type = 'recta'; else if (pk(di, 'down')) type = 'curva'; else if (pk(di, 'right')) type = 'rapida'; }
      if (type) { G.lastPitches = [type].concat(G.lastPitches || []).slice(0, 3); startPitch(type); }
      break;
    }
    case 'windup': {
      G.stateT += dt;
      const P = G.pitch, p = pitcherF();
      const q = P.qte;
      // humano: el lanzador se queda en la pose de espera mientras la aguja va y viene
      if (q.human && !q.res && !q.expired) {
        const holdT = q.holdU * P.dur;
        // se confirma con la MISMA tecla del lanzamiento; doble toque rápido = bola a propósito
        if (pk(1 - G.half, q.keyDir)) {
          if (G.t - q.lastPress < 0.28) { q.intentional = true; q.res = 'bad'; q.look = 'perfect'; q.m = q.c + rand(-0.45, 0.45) * q.sw; q.pendingAt = -1; q.holding = false; qteFx(q); }
          else if (q.holding && q.pendingAt < 0) { q.pendingAt = G.t; q.frozenM = q.m; }
          q.lastPress = G.t;
        }
        if (q.res) { /* bola a propósito */ }
        else if (q.pendingAt >= 0) {
          G.stateT = Math.min(G.stateT, holdT); q.m = q.frozenM;
          if (G.t - q.pendingAt > 0.24) { q.holding = false; q.pendingAt = -1; judgeQte(q, q.frozenM); }
        } else if (G.stateT >= holdT) {
          G.stateT = holdT; q.holding = true;
          q.phase += dt;
          const k = q.phase / q.passT, pass = Math.floor(k);
          if (pass > q.passes) { q.passes = pass; if (pass < q.maxPasses) SFX.qtePass(pass === q.maxPasses - 1); }
          if (q.passes >= q.maxPasses) { q.expired = true; q.holding = false; q.m = q.passes % 2 ? 1 : 0; }
          else { const fr = k - pass; q.m = pass % 2 ? 1 - fr : fr; }
        }
      }
      if (!offPlayer().cpu && pk(G.half, 'down')) callSteal();
      const u = G.stateT / P.dur;
      p.char.aopt.uOverride = q.holding ? u + Math.sin(G.t * 22) * 0.004 : u;
      const hand = p.char.worldHand('R', new V3());
      CHAPA.position.copy(hand); CHAPA.visible = true;
      HANDLIGHT.position.copy(hand); HANDLIGHT.intensity = 6 * clamp(u / 0.8, 0, 1);
      // la misma preparación para recta, curva y rápida: solo el que lanza sabe cuál es
      FX.swirl(hand, PITCH_NEUTRAL, G.stateT, 0.2, 1);
      if (Math.random() < 0.4) FX.sparkle(hand, PITCH_NEUTRAL, 1, 0.08);
      // quick time event
      if (!q.res) {
        if (!q.human) { q.m = clamp((u - 0.06) / 0.72, 0, 1); if (q.m >= q.cpuAt) judgeQte(q, q.m); }
      }
      // etiqueta de telegrafía
      const hp = p.char.root.position.clone().add(new V3(0, p.char.height + 0.5, 0)).project(camera);
      UI.showTele((hp.x * 0.5 + 0.5) * innerWidth, (-hp.y * 0.5 + 0.5) * innerHeight, q);
      if (u >= 0.8) { UI.hideTele(); HANDLIGHT.intensity = 0; releasePitch(); }
      break;
    }
    case 'flight': updatePitchFlight(dt); break;
    case 'called': updateCalled(dt); break;
    case 'foul': updateFoul(dt); break;
    case 'play': updatePlay(dt); break;
    case 'halfend':
      G.stateT += dt;
      if (G.stateT > 1.7) { UI.fade(1); G.state = 'halfswap'; G.stateT = 0; }
      break;
    case 'halfswap':
      G.stateT += dt;
      if (G.stateT > 0.4) { advanceHalf(); UI.fade(0); }
      break;
    case 'gameover': G.stateT += dt; break;
  }
  // corredores robando mientras vuela la chapa
  if ((G.state === 'flight' || G.state === 'called') && G.bases) {
    for (const r of G.bases) {
      if (!r || !r.stealing || r.state !== 'run') continue;
      r.prog = Math.min(0.97, r.prog + (r.speed * dt) / SIDE);
      const prev = r.char.root.position.clone();
      runnerPos(r, r.char.root.position);
      const mv = r.char.root.position.clone().sub(prev);
      if (mv.lengthSq() > 1e-7) r.char.targetYaw = Math.atan2(mv.x, mv.z);
      r.char.runPhase += r.speed * dt * 2.2; r.char.setAnim('run', {});
    }
  }
  // bate
  if (G.batFlip && !G.batFlip.done) { G.batFlip.t += dt; if (G.batFlip.t > (G.batFlip.big ? 0.55 : 0.3)) { G.batFlip.done = true; dropBat(G.batFlip.big); SFX.batDrop(); } }
  updateBat(dt);
  // el bateador anima su swing
  const b = G.teams[G.half] && batter();
  if (b && b.anim === 'bat' && b.aopt.swingT >= 0) { b.aopt.swingT += dt; if (b.aopt.swingT > 0.9 && G.state !== 'play') { b.aopt.swingT = -1; b.snapK = 14; } }
  if (b && b.anim === 'bat') b.aopt.load = G.state === 'windup' ? clamp(G.stateT / G.pitch.dur, 0, 1) : 0;
  // fildeadores en prepitch: vuelven a su sitio
  if ((G.state === 'prepitch' || G.state === 'windup' || G.state === 'flight' || G.state === 'called') && G.teams[0]) {
    for (const f of fielders()) {
      if (f.role === 'P') continue;
      const p = f.char.root.position; const dx = f.home.x - p.x, dz = f.home.z - p.z, dl = Math.hypot(dx, dz);
      if (dl > 0.15) { const st = Math.min(dl, f.speed * 0.8 * dt); p.x += dx / dl * st; p.z += dz / dl * st; f.char.targetYaw = Math.atan2(dx, dz); f.char.runPhase += f.speed * dt * 1.8; f.char.setAnim('run', { amp: 0.5 }); }
      else if (f.char.anim === 'run' || f.char.anim === 'scoop' || f.char.anim === 'throw' || f.char.anim === 'receive' || f.char.anim === 'catchHigh' || f.char.anim === 'cheer' || f.char.anim === 'sad' || f.char.anim === 'shrug' || f.char.anim === 'dive') {
        f.char.setAnim(f.role === 'C' ? 'squat' : 'ready'); f.char.facePoint(0, 0);
      }
      if (G.state === 'prepitch' && dl > 25) { p.x = f.home.x; p.z = f.home.z; }
      f.dived = false; f.diving = false; f.coverBase = 0;
    }
  }
}

// ---------- perro y espectadores ----------
function updateDog(dt) {
  const d = G.dog; if (!d || !G.env) return;
  const u = d.userData; u.t += dt;
  const area = G.env.dogArea;
  let speed = 0;
  if (u.state === 'wander') {
    if (u.t > u.next || !u.next) { u.target.set(rand(area.x0, area.x1), 0, rand(area.z0, area.z1)); u.next = u.t + rand(3, 7); }
    speed = 1.2;
  } else if (u.state === 'excited') {
    if (u.t > 0.1 && u.t < 0.15) u.target.set(d.position.x + rand(-3, 3), 0, d.position.z + rand(-2, 2));
    speed = 3.5; if (u.t > 2.5) { u.state = 'wander'; u.next = 0; }
  } else if (u.state === 'thief') {
    const play = G.play;
    if (play && play.ball && play.ball.state === 'flight') {
      const tg = play.landed ? CHAPA.position : play.landPt;
      u.target.set(tg.x, 0, tg.z); speed = 10.5;
      if (Math.random() < dt * 2) SFX.bark();
    } else if (!(play && play.ball && play.ball.state === 'dog')) { u.state = 'excited'; u.t = 0; }
  } else if (u.state === 'flee') {
    u.target.copy(u.exit); speed = 9;
    if (u.t > 4.5) { u.state = 'wander'; u.next = 0; d.position.set(rand(area.x0, area.x1), 0, rand(area.z0, area.z1)); }
  } else if (u.state === 'chase') {
    const c = CHAPA.position; u.target.set(clamp(c.x, -30, 30), 0, Math.max(-34, Math.min(c.z, -5)));
    speed = 6; if (u.t > 5) { u.state = 'wander'; u.next = 0; }
    if (Math.random() < dt * 1.5) SFX.bark();
  }
  const dx = u.target.x - d.position.x, dz = u.target.z - d.position.z, dl = Math.hypot(dx, dz);
  if (dl > 0.3) { d.position.x += dx / dl * speed * dt; d.position.z += dz / dl * speed * dt; d.rotation.y = angDamp(d.rotation.y, Math.atan2(dx, dz), 6, dt); } else speed = 0;
  u.phase += dt * (speed > 0 ? 6 + speed * 3 : 0);
  const s = Math.sin(u.phase) * Math.min(1, speed * 0.5) * 0.7;
  u.legs[0].rotation.x = s; u.legs[3].rotation.x = s; u.legs[1].rotation.x = -s; u.legs[2].rotation.x = -s;
  u.tail.rotation.y = Math.sin(G.t * (u.state === 'wander' ? 6 : 18)) * 0.6;
  u.head.rotation.x = speed > 0 ? 0.1 : Math.sin(G.t * 0.7) * 0.15;
  d.position.y = Math.abs(Math.sin(u.phase)) * 0.04 * Math.min(1, speed);
}

  if (QUAL.t < 2.5) return;
  const avg = QUAL.acc / QUAL.n; QUAL.acc = 0; QUAL.n = 0; QUAL.t = 0;
  if (document.hidden) return;
  const crowd = G.env && G.env.crowd;
  if (avg > 1 / 42 && QUAL.pr <= QUAL.min + 0.01 && crowd && crowd.setDensity) { QUAL.crowd = Math.max(0.35, (QUAL.crowd || 1) - 0.2); crowd.setDensity(QUAL.crowd); }
  if (avg > 1 / 42 && QUAL.pr > QUAL.min) setPixelRatio(Math.max(QUAL.min, QUAL.pr - 0.2));
  else if (avg < 1 / 58 && QUAL.pr < QUAL.max) setPixelRatio(Math.min(QUAL.max, QUAL.pr + 0.1));
}
function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = (now - last) / 1000; last = now;
  const realDt = Math.min(0.05, rawDt);
  if (window.__noRender) return;
  tick(realDt, true);
  if (rawDt < 0.25) adaptQuality(rawDt);
}
function tick(realDt, render) {
  const dt = Clock.step(realDt);
  G.t += dt;
  // teclas globales
  if (kp('Escape') || (kp('KeyP') && G.state !== 'menu')) togglePause();
  if (kp('KeyM')) toggleMusic();
  if (kp('KeyN')) toggleVoice();
  if (G.state === 'menu') handlePickKeys();
  if (G.state !== 'menu') updateGame(dt);
  if (!G.paused) {
    updateTimers(dt);
    for (const c of ALL_CHARS) if (c.root.visible) c.update(dt);
    FX.update(dt); FX.updateRockets(dt);
    updateDog(dt);
    if (G.env && G.env.crowd) G.env.crowd.update(Clock.game, dt);
    for (const s of G.specs) { if (G.state === 'play' && G.play && G.play.res && G.stateT < 2.5 && !s._ch) { s._ch = true; s.setAnim(s.spot.sit ? 'sit' : 'cheer', { cheer: true, seat: s.spot.sit, ph: rand(0, 6) }); } if (G.state === 'prepitch' && s._ch) { s._ch = false; s.setAnim(s.spot.sit || s.spot.wall ? 'sit' : 'idle', { seat: s.spot.sit || 0 }); } }
  }
  updateWorld(dt, Clock.game);
  TRAIL.update();
  Juice.update(realDt);
  GU.time.value = Clock.real;
  updateCamera(G.paused ? 0 : dt, realDt);
  if (window.__dbgCam) { camera.position.fromArray(window.__dbgCam.pos); camera.lookAt(new V3().fromArray(window.__dbgCam.look)); }
  if (render) composer.render();
  Keys.pressed.clear();
}
// ganchos de prueba (no afectan el juego normal)
window.__tick = (secs, step = 1 / 60) => { for (let t = 0; t < secs; t += step) tick(step, false); };
window.__render = () => { renderer.info.autoReset = false; renderer.info.reset(); composer.render(); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, progs: renderer.info.programs.length, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures }; };
window.__setShadows = (on) => { sun.castShadow = on; };
window.__chapaPos = () => CHAPA.position;
window.__hideType = (t) => { scene.traverse((o) => { if (o.isMesh && o.geometry && o.geometry.type === t) o.visible = false; }); };
window.__scene = scene;
window.__key = (code) => { Keys.pressed.add(code); };
window.__hold = (code, on) => { if (on) Keys.down.add(code); else Keys.down.delete(code); };
function toggleMusic() { SFX.init(); const on = SFX.toggleMusic(); $('tMusic').style.opacity = on ? 1 : 0.5; UI.toast(on ? 'Música: sí' : 'Música: no', 900); }
function toggleVoice() { const on = SFX.toggleVoice(); $('tVoice').style.opacity = on ? 1 : 0.5; UI.toast(on ? 'Narrador: sí' : 'Narrador: no', 900); }

// ---------- controles táctiles ----------
function buildTouch() {
  if (!IS_TOUCH) return;
  const t = $('touch'); t.hidden = false;
  t.innerHTML = `<div class="grp pad"><span></span><button data-k="KeyW">▲</button><span></span><button data-k="KeyA">◀</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button></div>
   <div class="grp pad"><span></span><button data-k="ArrowUp" style="background:var(--sun)">▲</button><span></span><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div>`;
  t.querySelectorAll('button').forEach((b) => {
    const k = b.dataset.k;
    const down = (e) => { e.preventDefault(); SFX.init(); if (!Keys.down.has(k)) Keys.pressed.add(k); Keys.down.add(k); };
    const up = (e) => { e.preventDefault(); Keys.down.delete(k); };
    b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  });
}

// ===================== ARRANQUE =====================
function boot() {
  buildSky(); buildClouds(); buildMotes(); buildBirds();
  FX.init();
  buildShared();
  useField('barrio');
  $('tVoice').textContent = 'Narrador';
  $('tMusic').onclick = () => toggleMusic();
  $('tVoice').onclick = () => toggleVoice();
  document.addEventListener('pointerdown', () => SFX.init(), { once: true });
  document.addEventListener('keydown', () => SFX.init(), { once: true });
  buildTouch();
  showTitle();
  snapCamera();
  requestAnimationFrame(frame);
  window.__G = G; window.__SETUP = SETUP; window.__fn = { advanceHalf, setupHalf, toPrePitch, startPitch, endHalf };
  window.__putRunner = (b) => { const T = G.teams[G.half]; const m = T.mates.find((x) => x.onBench); m.onBench = false; const r = makeRunner(m, b + 1); G.bases[b] = r; leadoff(r); seatBench(G.half); };
  window.__start = (o) => { Object.assign(SETUP, o); G.mode = SETUP.mode; G.difficulty = SETUP.difficulty; G.innings = SETUP.innings; G.fieldId = SETUP.field;
    G.players = [0, 1].map((i) => ({ name: SETUP.names[i], cap: SETUP.caps[i], cpu: !!o.cpu, css: TEAM_COLORS[i].css, color: TEAM_COLORS[i].main })); $('endscreen').hidden = true; G.outcomes = []; startGame(); };
}

// ---- 99_boot.js ----
boot();

</script>
