<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Chapita!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Rótulo de barrio: letras gordas pintadas a mano, tinta morada oscura, sol caribeño y vinotinto */
:root {
  --ink: #1d1630; --ink-soft: #3a2f52; --sun: #ffc83d; --sun-deep: #f29d1f; --vino: #8b1e3f; --vino-hi: #b0234f;
  --turq: #19b3a6; --sky: #5bb7ff; --cream: #fff6e3; --cream-2: #f6e6c4; --red: #ff4a2e; --green: #45c46a; --blue: #2f8fe8;
  --recta: #47b8ff; --curva: #7dff6a; --rapida: #ff4a2e;
  --t1: #b0234f; --t2: #1d8fe0;
  --font-display: 'Lilita One', 'Arial Black', 'Trebuchet MS', sans-serif;
  --font-body: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #9fd6f5; color: var(--ink); font-family: var(--font-body); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
#ui * { box-sizing: border-box; }
.layer { position: absolute; inset: 0; }
.clickable, .btn, input, .card, .seg button, .chip-btn { pointer-events: auto; }

/* ---------- botones ---------- */
.btn { font-family: var(--font-display); font-size: clamp(18px, 2.4vw, 26px); letter-spacing: 0.02em; color: var(--ink);
  background: var(--sun); border: 3px solid var(--ink); border-radius: 16px; padding: 0.45em 1.1em 0.4em; cursor: pointer;
  box-shadow: 0 6px 0 var(--ink); transform: translateY(0); transition: transform .08s, box-shadow .08s, background .15s; }
.btn:hover { transform: translateY(-2px) rotate(-1deg); box-shadow: 0 8px 0 var(--ink); background: #ffd65e; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible { outline: 4px dashed var(--vino); outline-offset: 4px; }
.btn.vino { background: var(--vino-hi); color: var(--cream); }
.btn.vino:hover { background: #c92b5c; }
.btn.turq { background: var(--turq); color: var(--cream); }
.btn.turq:hover { background: #1fc8b9; }
.btn.ghost { background: var(--cream); }
.btn.small { font-size: 16px; padding: 0.35em 0.8em; box-shadow: 0 4px 0 var(--ink); border-radius: 12px; }

/* ---------- menú ---------- */
#menu { display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
#menu[hidden] { display: none !important; }
.panel { pointer-events: auto; background: var(--cream); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 10px 0 var(--ink), 0 30px 60px rgba(29,22,48,.35);
  padding: clamp(16px, 3vw, 30px); max-width: min(980px, 100%); width: 100%; position: relative; animation: panelIn .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes panelIn { from { transform: translateY(40px) scale(.9) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); margin: 0 0 6px; text-wrap: balance; letter-spacing: .01em; }
.panel .sub { margin: 0 0 18px; font-size: 17px; color: var(--ink-soft); font-weight: 600; }
.tape { position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(-3deg); background: var(--sun); border: 3px solid var(--ink); padding: 2px 18px; font-family: var(--font-display); font-size: 18px; border-radius: 6px; white-space: nowrap; }

#title { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: auto; padding-block: 20px; }
.logo { font-family: var(--font-display); font-size: clamp(64px, 14vw, 170px); line-height: .9; color: var(--sun); letter-spacing: .01em; display: flex; gap: .02em;
  text-shadow: 0.04em 0.0em 0 var(--ink), 0.037em 0.015em 0 var(--ink), 0.028em 0.028em 0 var(--ink), 0.015em 0.037em 0 var(--ink), 0.0em 0.04em 0 var(--ink), -0.015em 0.037em 0 var(--ink), -0.028em 0.028em 0 var(--ink), -0.037em 0.015em 0 var(--ink), -0.04em 0.0em 0 var(--ink), -0.037em -0.015em 0 var(--ink), -0.028em -0.028em 0 var(--ink), -0.015em -0.037em 0 var(--ink), -0.0em -0.04em 0 var(--ink), 0.015em -0.037em 0 var(--ink), 0.028em -0.028em 0 var(--ink), 0.037em -0.015em 0 var(--ink); filter: drop-shadow(0 .07em 0 var(--ink)) drop-shadow(0 .12em 0 var(--vino)); }
.logo span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
.logo span:nth-child(odd) { color: #fff1c9; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-.08em) rotate(2deg); } }
.tagline { font-family: var(--font-display); font-size: clamp(18px, 2.6vw, 28px); color: var(--cream); background: var(--vino-hi); border: 3px solid var(--ink); padding: 4px 18px; border-radius: 10px; transform: rotate(-1.5deg); box-shadow: 0 5px 0 var(--ink); }
.title-btns { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.howto { max-width: 760px; background: rgba(255,246,227,.94); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 18px; font-size: 15.5px; line-height: 1.45; box-shadow: 0 6px 0 var(--ink); text-align: left; }
.howto b { font-family: var(--font-display); font-weight: 400; }
.howto-cols { display: flex; gap: 10px 24px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 2px dashed rgba(29,22,48,.2); font-size: 16.5px; }
.kbd { display: inline-block; font-family: var(--font-display); font-size: .92em; min-width: 1.8em; text-align: center; padding: 0 .4em; border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 7px; background: #fff; line-height: 1.35; }
.kbd svg.arw { width: .95em; height: .95em; vertical-align: -0.12em; display: inline-block; }
.kbd.recta { background: var(--recta); } .kbd.curva { background: var(--curva); } .kbd.rapida { background: var(--rapida); color: #fff; }
.toggles { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; display: flex; gap: 8px; pointer-events: auto; z-index: 5; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-family: var(--font-display); font-size: 18px; }
.field input { font-family: var(--font-display); font-size: 22px; padding: 8px 12px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; }
.field input:focus { outline: 4px solid var(--sun); }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { font-family: var(--font-display); font-size: 20px; padding: 8px 16px; border: 3px solid var(--ink); background: #fff; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); color: var(--ink); }
.seg button.on { background: var(--sun); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.seg button:focus-visible { outline: 3px dashed var(--vino); outline-offset: 3px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 8px; }
.card { background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 14px; cursor: pointer; box-shadow: 0 6px 0 var(--ink); transition: transform .12s, background .2s; position: relative; min-width: 0; text-align: left; font: inherit; color: inherit; }
.card:hover { transform: translateY(-3px) rotate(-.6deg); }
.card.on { background: #fff1c2; transform: translateY(-4px) rotate(-1deg); box-shadow: 0 10px 0 var(--ink); }
.card.on::after { content: '✔'; position: absolute; top: -14px; right: -10px; width: 38px; height: 38px; border-radius: 50%; background: var(--green); border: 3px solid var(--ink); color: #fff; font-size: 20px; display: grid; place-items: center; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1; }
.card .nick { font-family: var(--font-display); color: var(--vino-hi); font-size: 18px; }
.card .age { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin-top: 2px; }
.card p { font-size: 14.5px; line-height: 1.35; margin: 8px 0 10px; }
.stat { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; margin: 3px 0; text-transform: uppercase; letter-spacing: .04em; }
.pips { display: flex; gap: 4px; }
.pips i { flex: 1; height: 12px; border: 2px solid var(--ink); border-radius: 4px; background: #eee; }
.pips i.f { background: var(--sun); } .pips i.f.hi { background: var(--red); }
.panel.pick { padding: 14px 18px 16px; }
.panel.pick h2 { font-size: clamp(20px, 2.6vw, 30px); }
.card.compact { padding: 10px 12px; }
.card.compact h3 { font-size: 22px; }
.card.compact .nick { font-size: 16px; }
.card.compact p { font-size: 13px; margin: 4px 0 6px; line-height: 1.3; }
.card.compact .stat { margin: 1px 0; font-size: 11.5px; grid-template-columns: 66px 1fr; }
.card.compact .pips i { height: 10px; }
.panel.pick .row-end { margin-top: 12px; }
.thumb { height: 92px; border-radius: 12px; border: 3px solid var(--ink); margin-bottom: 10px; background-size: cover; }
.row-end { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.picker-who { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 20px; padding: 2px 14px; border-radius: 999px; border: 3px solid var(--ink); color: #fff; }
.hint-line { font-size: 14px; color: var(--ink-soft); font-weight: 700; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 12px; display: flex; gap: 10px; align-items: flex-start; transform-origin: top left; }
.board { background: #183a2c; border: 4px solid var(--ink); border-radius: 16px; color: #fff; padding: 8px 10px 8px; box-shadow: 0 6px 0 var(--ink); font-family: var(--font-display); }
.board table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.board td, .board th { padding: 1px 6px; text-align: center; font-weight: 400; font-size: 17px; min-width: 22px; }
.board th { color: #9fe8c4; font-size: 13px; }
.board td.name { text-align: left; min-width: 96px; max-width: 120px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.board td.R { color: var(--sun); font-size: 22px; }
.board tr.bat td.name::before { content: '▸'; color: var(--sun); margin-right: 3px; }
.board .cur { background: rgba(255,200,61,.18); border-radius: 6px; }
.count { background: var(--cream); border: 4px solid var(--ink); border-radius: 16px; padding: 8px 12px; box-shadow: 0 6px 0 var(--ink); display: grid; grid-template-columns: auto auto; gap: 4px 12px; align-items: center; }
.count .lbl { font-family: var(--font-display); font-size: 18px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--ink); background: #e9dcc0; transition: background .2s, transform .2s; }
.dots.b i.on { background: var(--green); transform: scale(1.12); } .dots.s i.on { background: var(--sun); transform: scale(1.12); } .dots.o i.on { background: var(--red); transform: scale(1.12); }
.inn { font-family: var(--font-display); font-size: 20px; grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.diamond { width: 46px; height: 46px; position: relative; }
.diamond i { position: absolute; width: 15px; height: 15px; border: 2.5px solid var(--ink); background: #e9dcc0; transform: rotate(45deg); transition: background .2s; }
.diamond i.on { background: var(--sun); box-shadow: 0 0 0 2px var(--vino-hi); }
.diamond i:nth-child(1) { right: 2px; top: 16px; } .diamond i:nth-child(2) { left: 15px; top: 2px; } .diamond i:nth-child(3) { left: 2px; top: 16px; }

#roles { position: absolute; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: 12px; padding-inline: 12px; align-items: flex-end; }
.role { background: var(--cream); border: 4px solid var(--ink); border-radius: 18px; padding: 8px 14px; box-shadow: 0 6px 0 var(--ink); min-width: 0; max-width: 48%; transition: transform .3s, opacity .3s; }
.role .who { font-family: var(--font-display); font-size: 20px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role .tag { font-size: 12px; font-weight: 800; letter-spacing: .1em; padding: 1px 8px; border-radius: 999px; color: #fff; border: 2px solid var(--ink); }
.role .keys { display: flex; gap: 8px; margin-top: 4px; font-size: 14px; font-weight: 700; flex-wrap: wrap; align-items: center; }
.role.dim { opacity: .55; transform: translateY(6px) scale(.96); }
.role.pulse { animation: rolePulse .9s ease-in-out infinite; }
@keyframes rolePulse { 50% { transform: translateY(-4px) scale(1.03); } }

#tele { position: absolute; transform: translate(-50%, -100%); font-family: var(--font-display); font-size: 22px; color: #fff; padding: 2px 14px 0; border: 3px solid var(--ink); border-radius: 12px; white-space: nowrap; box-shadow: 0 4px 0 var(--ink); }
#tele { min-width: 176px; text-align: center; padding-bottom: 4px; transition: transform .15s; }
#tele .qte { position: relative; height: 16px; background: rgba(29,22,48,.6); border: 2.5px solid var(--ink); border-radius: 8px; margin: 3px 0 4px; overflow: hidden; }
#tele .qte i { position: absolute; top: 0; bottom: 0; display: block; }
#tele .qte .zone { background: #45c46a; }
#tele .qte .sweet { background: #ffd23f; }
#tele .qte .needle { width: 5px; margin-left: -2.5px; background: #fff; box-shadow: 0 0 8px #fff, 0 0 2px var(--ink); }
#tele .qpass { display: flex; justify-content: center; gap: 5px; margin: 0 0 3px; }
#tele .qpass[hidden] { display: none; }
#tele .qpass i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(29,22,48,.35); }
#tele .qpass i.on { background: #fff; }
#tele.last .qte .needle { background: var(--red); box-shadow: 0 0 10px var(--red); }
#tele .qkey { font-size: 15px; line-height: 1.2; min-height: 1.3em; }
#tele .qkey .kbd { color: var(--ink); font-size: 13px; }
#tele.res-perfect { transform: translate(-50%, -100%) scale(1.15); box-shadow: 0 0 0 4px #ffd23f, 0 4px 0 var(--ink); }
#tele.res-good { box-shadow: 0 0 0 4px #45c46a, 0 4px 0 var(--ink); }
#tele.res-bad { transform: translate(-50%, -100%) rotate(-4deg); box-shadow: 0 0 0 4px var(--red), 0 4px 0 var(--ink); }

#popups { position: absolute; inset: 0; overflow: hidden; }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 34px; color: #fff; white-space: nowrap; animation: popUp 1.3s cubic-bezier(.2,1.5,.4,1) forwards;
  text-shadow: 2.5px 0.0px 0 var(--ink), 2.165px 1.25px 0 var(--ink), 1.25px 2.165px 0 var(--ink), 0.0px 2.5px 0 var(--ink), -1.25px 2.165px 0 var(--ink), -2.165px 1.25px 0 var(--ink), -2.5px 0.0px 0 var(--ink), -2.165px -1.25px 0 var(--ink), -1.25px -2.165px 0 var(--ink), -0.0px -2.5px 0 var(--ink), 1.25px -2.165px 0 var(--ink), 2.165px -1.25px 0 var(--ink), 0 4px 0 var(--ink); }
.pop.sm { font-size: 24px; text-shadow: 2.0px 0.0px 0 var(--ink), 1.732px 1.0px 0 var(--ink), 1.0px 1.732px 0 var(--ink), 0.0px 2.0px 0 var(--ink), -1.0px 1.732px 0 var(--ink), -1.732px 1.0px 0 var(--ink), -2.0px 0.0px 0 var(--ink), -1.732px -1.0px 0 var(--ink), -1.0px -1.732px 0 var(--ink), -0.0px -2.0px 0 var(--ink), 1.0px -1.732px 0 var(--ink), 1.732px -1.0px 0 var(--ink), 0 3px 0 var(--ink); }
.pop.lg { font-size: 54px; text-shadow: 3.5px 0.0px 0 var(--ink), 3.234px 1.339px 0 var(--ink), 2.475px 2.475px 0 var(--ink), 1.339px 3.234px 0 var(--ink), 0.0px 3.5px 0 var(--ink), -1.339px 3.234px 0 var(--ink), -2.475px 2.475px 0 var(--ink), -3.234px 1.339px 0 var(--ink), -3.5px 0.0px 0 var(--ink), -3.234px -1.339px 0 var(--ink), -2.475px -2.475px 0 var(--ink), -1.339px -3.234px 0 var(--ink), -0.0px -3.5px 0 var(--ink), 1.339px -3.234px 0 var(--ink), 2.475px -2.475px 0 var(--ink), 3.234px -1.339px 0 var(--ink), 0 5px 0 var(--ink); }
@keyframes popUp { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; } 18% { transform: translate(-50%, -60%) scale(1.25) rotate(4deg); opacity: 1; } 32% { transform: translate(-50%, -62%) scale(1) rotate(-2deg); } 80% { opacity: 1; } 100% { transform: translate(-50%, -140%) scale(.9) rotate(0); opacity: 0; } }

#banner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
#banner .burst { position: absolute; width: 140vmax; height: 140vmax; background: repeating-conic-gradient(from 0deg, rgba(255,200,61,.55) 0deg 9deg, rgba(255,246,227,0) 9deg 18deg); border-radius: 50%; animation: spin 7s linear infinite, burstIn .6s ease-out both; mask: radial-gradient(circle, #000 0 20%, transparent 55%); -webkit-mask: radial-gradient(circle, #000 0 20%, transparent 55%); }
@keyframes spin { to { rotate: 360deg; } }
@keyframes burstIn { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
#banner .big { position: relative; font-family: var(--font-display); font-size: clamp(56px, 13vw, 170px); line-height: .95; color: var(--sun); text-align: center; text-shadow: 0.04em 0.0em 0 var(--ink), 0.037em 0.015em 0 var(--ink), 0.028em 0.028em 0 var(--ink), 0.015em 0.037em 0 var(--ink), 0.0em 0.04em 0 var(--ink), -0.015em 0.037em 0 var(--ink), -0.028em 0.028em 0 var(--ink), -0.037em 0.015em 0 var(--ink), -0.04em 0.0em 0 var(--ink), -0.037em -0.015em 0 var(--ink), -0.028em -0.028em 0 var(--ink), -0.015em -0.037em 0 var(--ink), -0.0em -0.04em 0 var(--ink), 0.015em -0.037em 0 var(--ink), 0.028em -0.028em 0 var(--ink), 0.037em -0.015em 0 var(--ink), 0 .07em 0 var(--ink), 0 .12em 0 var(--vino); animation: bannerIn .8s cubic-bezier(.15,1.8,.4,1) both; padding-inline: 16px; }
#banner .big.white { color: #fff; }
#banner .big.red { color: var(--red); }
#banner .small { position: relative; margin-top: 14px; font-family: var(--font-display); font-size: clamp(20px, 3vw, 32px); color: var(--cream); background: var(--ink); padding: 4px 18px; border-radius: 12px; transform: rotate(-2deg); animation: bannerIn .8s .15s cubic-bezier(.15,1.8,.4,1) both; text-align: center; max-width: 92vw; }
@keyframes bannerIn { from { transform: scale(.1) rotate(-15deg); opacity: 0; } to { transform: scale(1) rotate(-2deg); opacity: 1; } }
#banner.out .big, #banner.out .small, #banner.out .burst { animation: bannerOut .35s ease-in forwards; }
@keyframes bannerOut { to { transform: scale(1.6); opacity: 0; } }

#fade { position: absolute; inset: 0; background: var(--ink); opacity: 0; transition: opacity .35s; }
#pause, #endscreen { display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(29,22,48,.45); pointer-events: auto; }
#pause[hidden], #endscreen[hidden], #hud[hidden], #roles[hidden], #tele[hidden], #touch[hidden] { display: none !important; }
.end-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 12px 0; }
.end-table th, .end-table td { border-bottom: 2px dashed rgba(29,22,48,.25); padding: 6px 8px; text-align: center; font-size: 17px; }
.end-table th { font-family: var(--font-display); font-weight: 400; }
.end-table td:first-child, .end-table th:first-child { text-align: left; }
.tbl-wrap { overflow-x: auto; }

#toast { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: 22px; background: var(--ink); color: var(--cream); padding: 6px 16px; border-radius: 12px; opacity: 0; transition: opacity .3s, transform .3s; white-space: nowrap; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(-6px); }

#touch { position: absolute; left: 0; right: 0; bottom: 120px; display: flex; justify-content: space-between; padding-inline: 12px; pointer-events: none; }
#touch .grp { display: grid; gap: 8px; pointer-events: auto; }
#touch button { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); font-family: var(--font-display); font-size: 15px; background: rgba(255,246,227,.9); color: var(--ink); box-shadow: 0 4px 0 var(--ink); touch-action: none; }
#touch .pad { grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); }
#touch .pad button { width: 56px; height: 56px; border-radius: 14px; }

@media (max-width: 720px) {
  #hud { transform: scale(.7); }
  #menu { padding-top: 64px; }

// quality: 'perfect' pinta una esquina y va más rápido, 'good' siempre es strike, 'bad' siempre es bola
function planPitch(type, pitcher, rng, releasePos, curveDir, quality) {
  const B = pitcher.arm, E = pitcher.spin;
  let T, sigma, lat = 0, drop = 0, wob = 0.05, wobF = 9;
  const baseT = 0.70 - 0.036 * B;
  if (type === 'recta') {

    x: ZONE.cx + gauss(rng) * sigma,
    y: ZONE.cy + gauss(rng) * sigma * 0.9,
    z: 0,
  };

    T *= 0.94; lat *= 1.15;
    target.x = ZONE.cx + sgn() * (0.13 + rng() * 0.15);
    target.y = ZONE.cy + sgn() * (0.1 + rng() * 0.24);
  } else if (quality === 'good') {
    target.x = clamp(ZONE.cx + gauss(rng) * 0.13, ZONE.cx - ZONE.hw + 0.04, ZONE.cx + ZONE.hw - 0.04);
    target.y = clamp(ZONE.cy + gauss(rng) * 0.13, ZONE.cy - ZONE.hh + 0.04, ZONE.cy + ZONE.hh - 0.04);
  } else if (quality === 'bad') {
    if (rng() < 0.55) { target.x = ZONE.cx + sgn() * (ZONE.hw + 0.1 + rng() * 0.32); target.y = ZONE.cy + gauss(rng) * 0.22; }
    else { target.x = ZONE.cx + gauss(rng) * 0.2; target.y = ZONE.cy + sgn() * (ZONE.hh + 0.09 + rng() * 0.26); }
  }
  const a = { x: lat, y: -PHYS.g + drop + PHYS.g * 0.55, z: 0 }; // la chapa "planea"
  const p0 = releasePos;
  const v0 = {
    x: (target.x - p0.x - 0.5 * a.x * T * T) / T,
    y: (target.y - p0.y - 0.5 * a.y * T * T) / T,
    z: (target.z - p0.z - 0.5 * a.z * T * T) / T,
  };
  const ph = rng() * 6.28;
  const strike = Math.abs(target.x - ZONE.cx) <= ZONE.hw && Math.abs(target.y - ZONE.cy) <= ZONE.hh;
  const speed = Math.hypot(v0.x, v0.y, v0.z);
  return {
    type, T, target, strike, speed, lat, dir: Math.sign(lat), quality,
    pos(t, out) {
      const tt = t;
      const env = Math.sin(Math.PI * clamp(tt / T, 0, 1));
      out.x = p0.x + v0.x * tt + 0.5 * a.x * tt * tt + env * wob * Math.sin(wobF * tt + ph);
      out.y = p0.y + v0.y * tt + 0.5 * a.y * tt * tt + env * wob * 0.6 * Math.cos(wobF * 1.3 * tt + ph);
      out.z = p0.z + v0.z * tt + 0.5 * a.z * tt * tt;
      return out;
    },
    vel(t, out) {
      out.x = v0.x + a.x * t; out.y = v0.y + a.y * t; out.z = v0.z + a.z * t; return out;
    },
  };
}

// ---------- BATEO ----------
function swingWindows(batter, type) {
  const C = batter.contact;
  const m = type === 'rapida' ? 0.86 : type === 'curva' ? 1.12 : 1.0;
  return {
    perfect: (0.015 + C * 0.0035) * m,
    good: (0.036 + C * 0.0062) * m,
    ok: (0.066 + C * 0.0085) * m,
  };
}

// e: error de tiempo (s), negativo = temprano. cp: punto donde cruza la chapa el plato.
function computeContact(batter, pitch, e, cp, rng) {
  const W = swingWindows(batter, pitch.type);
  const ae = Math.abs(e);
  const dx = cp.x - ZONE.cx, dy = cp.y - ZONE.cy;
  const locDist = Math.hypot(dx / 0.52, dy / 0.58);
  if (locDist > 1.12 || ae > W.ok) {
    return { contact: false, grade: ae > W.ok ? (e < 0 ? 'early' : 'late') : 'far', e };
  }
  let grade, qT;
  if (ae <= W.perfect) { grade = 'perfect'; qT = 1 - 0.08 * (ae / W.perfect); }
  else if (ae <= W.good) { grade = 'good'; qT = 0.86 - 0.24 * ((ae - W.perfect) / (W.good - W.perfect)); }
  else { grade = 'weak'; qT = 0.56 - 0.3 * ((ae - W.good) / (W.ok - W.good)); }
  const qL = 1 - 0.42 * Math.pow(clamp(locDist, 0, 1), 2);
  const q = qT * qL;
  const P = batter.power;
  let spray = clamp(e / W.good, -2, 2) * 0.72 + gauss(rng) * 0.06;
  let launch = 11.5 + P * 1.7 + dy * 42 + gauss(rng) * (9 + 14 * (1 - q));
  if (grade === 'weak') launch += (rng() < 0.6 ? -1 : 1) * (6 + rng() * 22);
  launch = clamp(launch, -12, 78);
  const ev = ((21.6 + P * 0.62) * (0.45 + 0.55 * q) + pitch.speed * 0.07 + gauss(rng) * 1.9) * 0.747;
  const la = (launch * Math.PI) / 180;
  const v = {
    x: Math.sin(spray) * Math.cos(la) * ev,
    y: Math.sin(la) * ev,
    z: -Math.cos(spray) * Math.cos(la) * ev,
  };
  return { contact: true, grade, q, spray, launch, ev, v, e };
}

// Simula el vuelo completo de la chapa bateada y devuelve muestras.
function simulateHit(p0, v0, fence, seed, groundDecel) {
  const rng = mulberry32(seed);
  const dt = PHYS.dt, sub = 3, h = dt / sub;
  const maxN = 1200;
  const pts = new Float32Array(maxN * 3);
  let x = p0.x, y = p0.y, z = p0.z, vx = v0.x, vy = v0.y, vz = v0.z;
  const f1 = 4 + rng() * 5, f2 = 3 + rng() * 6, f3 = 5 + rng() * 4;
  const p1 = rng() * 6.28, p2 = rng() * 6.28, p3 = rng() * 6.28;
  const fA = PHYS.flutter * (0.6 + rng() * 0.8);
  let landed = false, landIdx = -1, landT = 0, firstGround = null, foul = false, hr = false, hrIdx = -1;
  let wallIdx = -1, stopIdx = -1, maxH = y, bounces = 0, sliding = false, foulIdx = -1;
  let t = 0, n = 0;
  let prevR = Math.hypot(x, z);
  const decel = groundDecel || 9;
  for (n = 0; n < maxN; n++) {
    pts[n * 3] = x; pts[n * 3 + 1] = y; pts[n * 3 + 2] = z;
    if (stopIdx >= 0) break;
    for (let s = 0; s < sub; s++) {
      if (!sliding) {
        const sp = Math.hypot(vx, vy, vz);
        const hs2 = vx * vx + vz * vz;
        const lift = landed ? 0 : PHYS.lift * hs2 * Math.exp(-t / PHYS.liftTau);
        const fl = landed ? 0 : fA * Math.min(1, sp / 18);
        const ax = -PHYS.drag * sp * vx + fl * Math.sin(f1 * t + p1);
        const ay = -PHYS.gHit - PHYS.drag * sp * vy + lift + fl * 0.35 * Math.sin(f3 * t + p3);
        const az = -PHYS.drag * sp * vz + fl * 0.5 * Math.sin(f2 * t + p2);
        vx += ax * h; vy += ay * h; vz += az * h;
        x += vx * h; y += vy * h; z += vz * h;
        if (y <= PHYS.groundY) {
          y = PHYS.groundY;
          if (!landed) {
            landed = true; landIdx = n; landT = t; firstGround = { x, z, t };
            if (!hr && !isFairXZ(x, z)) { foul = true; foulIdx = n; }
          }
          if (Math.abs(vy) > 1.3 && bounces < 3) {
            vy = -vy * 0.3; vx *= 0.6; vz *= 0.6; bounces++;
          } else { vy = 0; sliding = true; }
        }
      } else {
        const hs = Math.hypot(vx, vz);
        const nhs = Math.max(0, hs - decel * h);
        if (hs > 0) { vx *= nhs / hs; vz *= nhs / hs; }
        x += vx * h; z += vz * h;
        if (nhs < 0.12) { stopIdx = n + 1; }
      }
      // cerca / pared
      const r = Math.hypot(x, z);
      if (!hr && !foul) {
        const ang = sprayAngle(x, z);
        if (Math.abs(ang) <= Math.PI / 4 + 0.015) {
          const R = fenceR(fence, ang);
          if (r >= R && prevR < R) {
            if (y > fence.h && !landed) { hr = true; hrIdx = n; }
            else {
              // rebote en la pared
              const nx = x / r, nz = z / r;
              const vr = vx * nx + vz * nz;
              if (vr > 0) { vx -= (1.35) * vr * nx; vz -= (1.35) * vr * nz; vx *= 0.7; vz *= 0.7; }
              x = nx * (R - 0.06); z = nz * (R - 0.06);
              if (wallIdx < 0) wallIdx = n;
              if (sliding && Math.hypot(vx, vz) < 1) { vx *= 0.3; vz *= 0.3; }
            }
          }
        } else if (!landed && z < 0 && r > 6 && y < 0.5) {
          // cruzó a territorio foul volando bajo
        }
      }
      prevR = Math.hypot(x, z);
      t += h;
      if (r > 130) { stopIdx = n + 1; break; }
    }
    if (y > maxH) maxH = y;
    if (foul && n - foulIdx > 50) { stopIdx = n + 1; }
    if (hr && landed && n - landIdx > 40) { stopIdx = n + 1; }
  }
  if (n >= maxN) n = maxN - 1;
  const count = Math.min(maxN, stopIdx >= 0 ? stopIdx + 1 : n + 1);
  // si la cruza por fuera de la línea antes de caer y cae foul, ya está marcado.
  // Línea de foul cuando no cae: si se detiene en foul antes de pasar bases, foul también
  if (!foul && !hr && firstGround) {
    // rodado que se sale de la línea antes de 1ra/3ra
    const lx = pts[(count - 1) * 3], lz = pts[(count - 1) * 3 + 2];
    if (!isFairXZ(lx, lz) && Math.hypot(lx, lz) < 13) foul = true;
  }
  return {
    pts, n: count, dt, landIdx, landT, firstGround, foul, hr, hrIdx, wallIdx, maxH,
    hang: landIdx >= 0 ? landIdx * dt : count * dt,
  };
}

function samplePos(sim, t, out) {
  const f = t / sim.dt;
  let i = Math.floor(f);
  if (i >= sim.n - 1) { i = sim.n - 1; out.x = sim.pts[i * 3]; out.y = sim.pts[i * 3 + 1]; out.z = sim.pts[i * 3 + 2]; return out; }
  if (i < 0) i = 0;
  const k = f - i, a = i * 3, b = (i + 1) * 3, p = sim.pts;
  out.x = p[a] + (p[b] - p[a]) * k; out.y = p[a + 1] + (p[b + 1] - p[a + 1]) * k; out.z = p[a + 2] + (p[b + 2] - p[a + 2]) * k;
  return out;
}

// Tiro parabólico de fildeador a base: devuelve plan con duración.
// Tiros más lentos y en globito para que se lean bien en pantalla
const THROW_K = 0.74;
function throwTime(d, arm) { return 0.16 + d / (arm * THROW_K); }
function planThrow(from, to, arm) {
  const d = Math.hypot(to.x - from.x, to.z - from.z);
  const T = throwTime(d, arm);
  const g = PHYS.g * 0.62;
  const v0 = {
    x: (to.x - from.x) / T,
    y: (to.y - from.y + 0.5 * g * T * T) / T,
    z: (to.z - from.z) / T,
  };
  return {
    T, from, to,
    pos(t, out) {
      out.x = from.x + v0.x * t; out.y = from.y + v0.y * t - 0.5 * g * t * t; out.z = from.z + v0.z * t; return out;
    },
  };
}

// Mejor fildeador: el que llega antes a un punto atrapable de la trayectoria.
function chooseFielder(sim, fielders, reaction) {
  let best = null;
  const catchR = 0.9;
  for (const f of fielders) {
    if (!f.canChase) continue;
    let found = -1;
    for (let i = 4; i < sim.n; i += 2) {
      const y = sim.pts[i * 3 + 1];
      if (y > 2.1) continue;
      const x = sim.pts[i * 3], z = sim.pts[i * 3 + 2];
      const t = i * sim.dt;
      const d = Math.max(0, Math.hypot(x - f.x, z - f.z) - catchR);
      if (reaction + d / f.speed <= t) { found = i; break; }
    }
    let score, idx;
    if (found >= 0) { idx = found; score = found * sim.dt; }
    else {
      idx = sim.landIdx >= 0 ? sim.landIdx : sim.n - 1;
      const x = sim.pts[idx * 3], z = sim.pts[idx * 3 + 2];
      score = 50 + Math.hypot(x - f.x, z - f.z) / f.speed;
    }
    if (!best || score < best.score) best = { f, idx, score, reachable: found >= 0 };
  }
  return best;
}

// ---- 03_audio.js ----
// ===================== AUDIO (todo sintetizado) =====================
const SFX = (() => {
  let ctx = null, master, sfx, music, amb, verb, verbIn, noiseBuf, musicOn = true, voiceOn = true, muted = false;
  let flightOsc = null, flightGain = null, flightLfo = null;
  let seqTimer = null, nextNoteTime = 0, step = 0;
  let crowdNode = null, crowdGain = null, crowdLevel = 0.12;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = 0.72;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.25;
    master.connect(comp); comp.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    music = ctx.createGain(); music.gain.value = 0.16; music.connect(master);
    amb = ctx.createGain(); amb.gain.value = 0.5; amb.connect(master);
    // reverb exterior corto
    verb = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 0.85), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    verb.buffer = ir; verbIn = ctx.createGain(); verbIn.gain.value = 0.35; verbIn.connect(verb); verb.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    startCrowd();
    if (musicOn) startMusic();
    // sin audio en segundo plano: evita que al volver se amontonen notas
    document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else ctx.resume(); });
  }
  const now = () => ctx.currentTime;
  // límite de voces simultáneas (lo que no es importante se descarta si hay demasiadas)
  let active = 0;
  const MAXV = 42;
  function track(node) { active++; node.onended = () => { active = Math.max(0, active - 1); }; }
  function hold(param, t) {
    if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t);
    else { const v = param.value; param.cancelScheduledValues(t); param.setValueAtTime(v, t); }
  }

  function tone(f, dur, o = {}) {
    if (!ctx) return;
    if (active > (o.imp ? MAXV + 12 : MAXV)) return;
    const t = now() + (o.delay || 0);
    const osc = ctx.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + (o.slide || dur));
    if (o.vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = o.vibF || 7; lg.gain.value = o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05); }
    const g = ctx.createGain(); const v = (o.vol ?? 0.3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) { const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; node.connect(f2); node = f2; }
    node.connect(g); g.connect(o.bus || sfx); if (o.verb) g.connect(verbIn);
    osc.start(t); osc.stop(t + dur + 0.05); track(osc);
    return osc;
  }
  function noise(dur, o = {}) {
    if (!ctx) return;
    if (active > (o.imp ? MAXV + 12 : MAXV)) return;
    const t = now() + (o.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = ctx.createGain(); const v = o.vol ?? 0.3;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.bus || sfx); if (o.verb) g.connect(verbIn);
    src.start(t, Math.random()); src.stop(t + dur + 0.05); track(src);
  }

  // ---------- público / ambiente ----------
  function startCrowd() {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 2200;
    crowdGain = ctx.createGain(); crowdGain.gain.value = 0.0;
    src.connect(f); f.connect(f2); f2.connect(crowdGain); crowdGain.connect(amb); src.start();
    crowdNode = src;
  }
  function setCrowdBase(v) { crowdLevel = v; if (crowdGain) { hold(crowdGain.gain, now()); crowdGain.gain.setTargetAtTime(v, now(), 0.6); } }
  function crowd(intensity = 1, dur = 2.5) {
    if (!ctx) return;

    hold(crowdGain.gain, t);
    crowdGain.gain.setTargetAtTime(crowdLevel + 0.5 * intensity, t, 0.12);
    crowdGain.gain.setTargetAtTime(crowdLevel, t + dur, 0.8);

  }
  function whistle(delay, vol) {
    const f = rand(1600, 2600);
    tone(f, rand(0.25, 0.5), { delay, to: f * rand(0.7, 1.3), vol: vol * 0.2, vib: 40, vibF: rand(6, 12), bus: amb });
  }
  function corneta(times = 2) {
    if (!ctx) return;
    for (let k = 0; k < times; k++) {
      const d = k * 0.45;
      [415, 523, 622].forEach((f) => tone(f, 0.38, { type: 'sawtooth', delay: d, vol: 0.06, lp: 1800, att: 0.02, verb: true }));
    }
  }

  // ---------- SFX del juego ----------
  const api = {
    init,
    get ready() { return !!ctx; },
    click() { tone(880, 0.06, { type: 'triangle', vol: 0.15, to: 1200 }); },
    select() { tone(660, 0.08, { type: 'triangle', vol: 0.15 }); tone(990, 0.1, { type: 'triangle', vol: 0.15, delay: 0.06 }); },
    confirm() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, { type: 'triangle', vol: 0.14, delay: i * 0.05 })); },
    swing(power = 1) { noise(0.22, { f: 700, to: 3200, q: 1.6, vol: 0.35 * power, ft: 'bandpass' }); },
    hit(q, perfect) {
      tone(190, 0.12, { to: 55, vol: 0.7, imp: 1 });
      noise(0.04, { ft: 'highpass', f: 3000, vol: 0.4, imp: 1 });
      [2350, 3870, 5110].forEach((f, i) => tone(f * rand(0.97, 1.03), 0.32 - i * 0.05, { vol: (0.1 + 0.08 * q) / (i + 1), verb: true, imp: 1 }));
      if (perfect) { tone(60, 0.55, { to: 35, vol: 0.65, type: 'sine', imp: 1 }); noise(0.45, { ft: 'lowpass', f: 400, vol: 0.3, verb: true, imp: 1 }); tone(1200, 0.35, { to: 2400, vol: 0.08, type: 'square', lp: 3000, delay: 0.02, imp: 1 }); }
    },
    qte(res) {
      if (res === 'perfect') { [1318, 1760, 2637].forEach((f, i) => tone(f, 0.22, { type: 'triangle', vol: 0.12, delay: i * 0.045 })); }
      else if (res === 'good') { tone(880, 0.12, { type: 'triangle', vol: 0.13 }); tone(1175, 0.14, { type: 'triangle', vol: 0.1, delay: 0.05 }); }
      else { tone(160, 0.22, { type: 'square', vol: 0.07, lp: 900, to: 110 }); }
    },
    qtePass(last) { tone(last ? 520 : 700, 0.05, { type: 'triangle', vol: last ? 0.12 : 0.07 }); },
    whoosh() { noise(0.3, { f: 400, to: 1500, q: 0.8, vol: 0.2 }); },
    catchPlop() { tone(320, 0.08, { to: 110, vol: 0.45, imp: 1 }); noise(0.05, { ft: 'lowpass', f: 900, vol: 0.25, imp: 1 }); },
    pito() { tone(2900, 0.32, { vib: 110, vibF: 28, vol: 0.18, att: 0.01 }); },
    strike() { tone(2900, 0.18, { vib: 120, vibF: 30, vol: 0.18 }); tone(2900, 0.3, { vib: 120, vibF: 30, vol: 0.18, delay: 0.22 }); },
    ball() { tone(420, 0.12, { type: 'triangle', vol: 0.18, to: 300 }); },
    out() { tone(110, 0.35, { to: 60, vol: 0.55, imp: 1 }); noise(0.2, { ft: 'lowpass', f: 300, vol: 0.4 }); tone(2900, 0.4, { vib: 120, vibF: 30, vol: 0.16, delay: 0.1 }); },
    safe() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.16, { type: 'square', vol: 0.08, lp: 2200, delay: i * 0.06 })); },

    batDrop() { for (let i = 0; i < 4; i++) tone(rand(500, 900), 0.07, { type: 'triangle', vol: 0.18 / (i + 1), delay: i * rand(0.08, 0.14) }); },
    land(v = 0.4) { tone(rand(1800, 2600), 0.09, { vol: v * 0.3 }); noise(0.06, { ft: 'highpass', f: 2000, vol: v * 0.3 }); },

    const i = this.n++;
    this.p[i * 3] = o.x; this.p[i * 3 + 1] = o.y; this.p[i * 3 + 2] = o.z;
    this.v[i * 3] = o.vx; this.v[i * 3 + 1] = o.vy; this.v[i * 3 + 2] = o.vz;
    this.c[i * 3] = o.color.r; this.c[i * 3 + 1] = o.color.g; this.c[i * 3 + 2] = o.color.b;
    this.wl0[i * 2] = o.width || 0.05; this.wl0[i * 2 + 1] = o.len || 0.5;
    this.life[i] = 0; this.maxLife[i] = o.life || 0.5; this.grav[i] = o.grav ?? 6; this.drag[i] = o.drag ?? 2;
  }
  update(dt) {
    let i = 0;
    while (i < this.n) {
      this.life[i] += dt;
      if (this.life[i] >= this.maxLife[i]) {
        const j = --this.n;
        if (i !== j) {
          for (let k = 0; k < 3; k++) { this.p[i * 3 + k] = this.p[j * 3 + k]; this.v[i * 3 + k] = this.v[j * 3 + k]; this.c[i * 3 + k] = this.c[j * 3 + k]; }
          this.wl0[i * 2] = this.wl0[j * 2]; this.wl0[i * 2 + 1] = this.wl0[j * 2 + 1];
          this.life[i] = this.life[j]; this.maxLife[i] = this.maxLife[j]; this.grav[i] = this.grav[j]; this.drag[i] = this.drag[j];
        }
        continue;
      }
      const t = this.life[i] / this.maxLife[i];
      const dr = Math.exp(-this.drag[i] * dt);
      this.v[i * 3] *= dr; this.v[i * 3 + 1] = this.v[i * 3 + 1] * dr - this.grav[i] * dt; this.v[i * 3 + 2] *= dr;
      for (let k = 0; k < 3; k++) this.p[i * 3 + k] += this.v[i * 3 + k] * dt;
      const f = 1 - t;
      this.w[i * 2] = this.wl0[i * 2] * f; this.w[i * 2 + 1] = this.wl0[i * 2 + 1] * f;
      i++;
    }
    this.geo.instanceCount = this.n;
    this.aP.needsUpdate = this.aV.needsUpdate = this.aC.needsUpdate = this.aW.needsUpdate = true;
  }
}

class ConfettiFX {
  constructor(max) {
    this.max = max; this.n = 0;
    const geo = new THREE.PlaneGeometry(0.16, 0.09);
    const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, toneMapped: false });
    this.mesh = new THREE.InstancedMesh(geo, mat, max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.count = 0; this.mesh.frustumCulled = false;
    this.items = [];
    for (let i = 0; i < max; i++) this.mesh.setColorAt(i, new THREE.Color(1, 1, 1));
    scene.add(this.mesh);
    this.d = new THREE.Object3D();
  }
  burst(pos, n, spread = 6, up = 10) {
    const cols = [0xff3d5a, 0xffc83d, 0x2fd17a, 0x34a7ff, 0xff7ad9, 0xffffff, 0xff8a1f];
    for (let k = 0; k < n; k++) {
      if (this.items.length >= this.max) this.items.shift();
      this.items.push({
        p: new V3(pos.x, pos.y, pos.z), v: new V3(rand(-spread, spread), rand(up * 0.5, up), rand(-spread, spread)),
        r: new V3(rand(0, 6), rand(0, 6), rand(0, 6)), w: new V3(rand(-12, 12), rand(-12, 12), rand(-12, 12)),
        life: 0, max: rand(3, 5.5), c: new THREE.Color(pick(cols)),
      });
    }
  }
  update(dt) {
    const it = this.items;
    for (let i = it.length - 1; i >= 0; i--) {
      const c = it[i]; c.life += dt;
      if (c.life > c.max) { it.splice(i, 1); continue; }
      c.v.y -= 9 * dt; c.v.multiplyScalar(Math.exp(-2.4 * dt));
      c.v.x += Math.sin(c.life * 3 + i) * 2 * dt;
      c.p.addScaledVector(c.v, dt);
      if (c.p.y < 0.02) { c.p.y = 0.02; c.v.set(0, 0, 0); c.w.multiplyScalar(0.9); }
      c.r.addScaledVector(c.w, dt);
    }
    for (let i = 0; i < it.length; i++) {
      const c = it[i];
      this.d.position.copy(c.p); this.d.rotation.set(c.r.x, c.r.y, c.r.z);
      const s = c.life > c.max - 0.5 ? (c.max - c.life) / 0.5 : 1; this.d.scale.setScalar(s);
      this.d.updateMatrix(); this.mesh.setMatrixAt(i, this.d.matrix); this.mesh.setColorAt(i, c.c);
    }
    this.mesh.count = it.length;
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
}

class RingFX {
  constructor(max) {
    this.pool = [];
    for (let i = 0; i < max; i++) {
      const m = new THREE.Mesh(new THREE.RingGeometry(0.82, 1, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
      m.visible = false; m.renderOrder = 12; scene.add(m);
      this.pool.push({ m, t: 0, life: 1, s0: 0, s1: 1, ground: false, active: false });
    }
  }
  spawn(pos, o = {}) {
    const r = this.pool.find((x) => !x.active) || this.pool[0];
    r.active = true; r.t = 0; r.life = o.life || 0.5; r.s0 = o.s0 ?? 0.1; r.s1 = o.s1 ?? 3; r.ground = !!o.ground; r.alpha = o.alpha ?? 1;
    r.m.position.copy(pos); r.m.material.color.set(o.color || 0xffffff).multiplyScalar(o.intensity || 1.5); r.m.visible = true;
    r.thick = o.thick ?? 0.18;
    if (r.ground) { r.m.rotation.set(-Math.PI / 2, 0, 0); r.m.position.y = Math.max(0.04, pos.y); }
  }
  update(dt) {
    for (const r of this.pool) {
      if (!r.active) continue;
      r.t += dt; const t = r.t / r.life;
      if (t >= 1) { r.active = false; r.m.visible = false; continue; }
      const s = r.s0 + (r.s1 - r.s0) * easeOut(t);
      r.m.scale.setScalar(s);
      if (!r.ground) r.m.quaternion.copy(camera.quaternion);
      r.m.material.opacity = (1 - t) * r.alpha;
    }
  }
}

// Estela de cinta orientada a cámara
class Trail {
  constructor(n, width, color) {
    this.n = n; this.width = width; this.pts = []; this.color = new THREE.Color(color);
    const g = new THREE.BufferGeometry();
    this.pos = new Float32Array(n * 2 * 3); this.al = new Float32Array(n * 2);
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('al', new THREE.BufferAttribute(this.al, 1).setUsage(THREE.DynamicDrawUsage));
    const idx = []; for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    g.setIndex(idx); g.boundingSphere = new THREE.Sphere(new V3(), 1e5);
    this.mat = new THREE.ShaderMaterial({
      uniforms: { color: { value: this.color } },
      vertexShader: 'attribute float al; varying float vA; void main(){ vA = al; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 color; varying float vA; void main(){ gl_FragColor = vec4(color * vA, 1.0); }',
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    });
    this.mesh = new THREE.Mesh(g, this.mat); this.mesh.frustumCulled = false; this.mesh.renderOrder = 8;
    this.geo = g; scene.add(this.mesh);
  }
  setColor(c, k = 1) { this.color.set(c).multiplyScalar(k); }
  reset() { this.pts.length = 0; }
  push(p) { this.pts.unshift(p.clone()); if (this.pts.length > this.n) this.pts.pop(); }
  fade() { if (this.pts.length) this.pts.pop(); }
  update() {
    const P = this.pts, cp = camera.position;
    const tmp = new V3(), side = new V3(), tc = new V3();
    for (let i = 0; i < this.n; i++) {
      const p = P[Math.min(i, P.length - 1)];
      if (!p) { this.al[i * 2] = this.al[i * 2 + 1] = 0; continue; }
      const q = P[Math.min(i + 1, P.length - 1)], r = P[Math.min(Math.max(i - 1, 0), P.length - 1)];
      tmp.subVectors(r, q); if (tmp.lengthSq() < 1e-8) tmp.set(0, 0, 1);
      tc.subVectors(cp, p);
      side.crossVectors(tmp, tc).normalize();
      const f = 1 - i / (this.n - 1);
      const w = this.width * (0.2 + 0.8 * f);
      this.pos[i * 6] = p.x + side.x * w; this.pos[i * 6 + 1] = p.y + side.y * w; this.pos[i * 6 + 2] = p.z + side.z * w;
      this.pos[i * 6 + 3] = p.x - side.x * w; this.pos[i * 6 + 4] = p.y - side.y * w; this.pos[i * 6 + 5] = p.z - side.z * w;
      const a = i < P.length ? f * f : 0;
      this.al[i * 2] = a; this.al[i * 2 + 1] = a;
    }
    this.geo.attributes.position.needsUpdate = true; this.geo.attributes.al.needsUpdate = true;
  }
}

const World = { time: 0, grassMats: [], clothMats: [], birds: [], motes: null };

function buildSky() {
  const g = new THREE.SphereGeometry(1000, 32, 16);
  const m = new THREE.ShaderMaterial({
    uniforms: { top: { value: SKY_TOP }, hor: { value: SKY_HORIZON }, sunDir: { value: SUN_DIR }, time: { value: 0 } },
    vertexShader: 'varying vec3 vW; void main(){ vW = normalize(position); vec4 p = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * p; gl_Position.z = gl_Position.w; }',
    fragmentShader: `uniform vec3 top, hor, sunDir; varying vec3 vW;
      void main(){ float h = vW.y;
        vec3 c = mix(hor, top, pow(smoothstep(-0.02, 0.6, h), 0.75));
        c = mix(c, hor * 1.03, smoothstep(0.02, -0.1, h));
        float s = max(dot(normalize(vW), sunDir), 0.0);
        c += vec3(1.0, 0.85, 0.6) * pow(s, 18.0) * 0.35;
        c += vec3(1.0, 0.95, 0.8) * pow(s, 600.0) * 6.0;
        c += vec3(1.0, 0.9, 0.7) * smoothstep(0.9993, 0.9996, s) * 4.0;
        gl_FragColor = vec4(c, 1.0); }`,
    side: THREE.BackSide, depthWrite: false, fog: false,
  });
  const sky = new THREE.Mesh(g, m); sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);
  World.sky = sky;
}

function buildClouds() {

// Grama instanciada como malla fusionada con viento en el vertex shader
function makeGrassMaterial(base, tip) {
  const m = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  m.userData.time = { value: 0 };
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = m.userData.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float tipk = uv.y * uv.y;
        float w1 = sin(uTime * 1.7 + position.x * 0.35 + position.z * 0.22);
        float w2 = sin(uTime * 2.9 + position.z * 0.7 + position.x * 0.1);
        float gust = smoothstep(0.3, 1.0, sin(uTime * 0.45 + position.x * 0.05 - position.z * 0.03));
        transformed.x += (w1 * 0.5 + w2 * 0.25 + gust * 0.9) * tipk * 0.14;
        transformed.z += (cos(uTime * 1.3 + position.x * 0.3) * 0.4 + gust * 0.5) * tipk * 0.09;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>');
  };
  World.grassMats.push(m);
  return m;
}

// region(x,z) -> densidad 0..1 ; colorFn(x,z) -> [base, tip]
function buildGrass(area, count, region, colors, hMin = 0.12, hMax = 0.28) {
  const pos = [], col = [], nor = [], uv = [];
  const cb = new THREE.Color(), ct = new THREE.Color();
  let made = 0, tries = 0;
  while (made < count && tries < count * 6) {
    tries++;
    const x = rand(area.x0, area.x1), z = rand(area.z0, area.z1);
    const d = region(x, z);
    if (d <= 0 || Math.random() > d) continue;
    made++;
    const h = rand(hMin, hMax) * (0.6 + 0.4 * d), w = rand(0.035, 0.06), a = rand(0, TAU), lean = rand(-0.06, 0.06);
    const ca = Math.cos(a), sa = Math.sin(a);
    const [b, t] = colors(x, z);
    cb.set(b); ct.set(t);
    const v = rand(0.85, 1.12); cb.multiplyScalar(v); ct.multiplyScalar(v);
    // triángulo con 2 bases + punta
    const px = [x - ca * w, x + ca * w, x + lean * sa];
    const pz = [z - sa * w, z + sa * w, z + lean * ca];
    const py = [0.01, 0.01, h];
    for (let k = 0; k < 3; k++) {
      pos.push(px[k], py[k], pz[k]); nor.push(0, 1, 0);
      const c = k < 2 ? cb : ct; col.push(c.r, c.g, c.b);
      uv.push(k === 1 ? 1 : 0, k < 2 ? 0 : 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  const mesh = new THREE.Mesh(g, makeGrassMaterial());
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}

function buildMotes() {
  const n = 220;
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) { p[i * 3] = rand(-40, 40); p[i * 3 + 1] = rand(0.3, 9); p[i * 3 + 2] = rand(-50, 12); ph[i] = rand(0, TAU); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 }, scale: { value: 500 } },
    vertexShader: `attribute float ph; uniform float t; uniform float scale; varying float vA;
      void main(){ vec3 p = position; p.x += sin(t * 0.3 + ph) * 1.5 + t * 0.4; p.y += sin(t * 0.7 + ph * 2.0) * 0.6; p.z += cos(t * 0.25 + ph) * 1.2;
        p.x = mod(p.x + 40.0, 80.0) - 40.0;
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = 0.07 * scale / -mv.z; gl_Position = projectionMatrix * mv;
        vA = 0.5 + 0.5 * sin(t * 2.0 + ph * 5.0); }`,
    fragmentShader: 'varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); gl_FragColor = vec4(vec3(1.0, 0.95, 0.75) * a * vA * 1.6, 1.0); }',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

  const pts = new THREE.Points(g, m); pts.frustumCulled = false;
  scene.add(pts);

}

// Guacamayas (los loros de Caracas) volando
function makeMacaw(colorA, colorB) {
  const grp = new THREE.Group();
  const pb = new PartBuilder();
  pb.add(GEO.sphereLo, colorA, [0, 0, 0], [0, 0, 0], [0.16, 0.14, 0.38]);
  pb.add(GEO.sphereLo, colorA, [0, 0.06, 0.32], [0, 0, 0], [0.12, 0.12, 0.13]);
  pb.add(GEO.cone, 0x2b2b2b, [0, 0.03, 0.46], [Math.PI / 2, 0, 0], [0.05, 0.1, 0.05]);
  pb.add(GEO.sphereLo, 0xffffff, [0.07, 0.09, 0.38], [0, 0, 0], [0.04, 0.04, 0.04]);
  pb.add(GEO.sphereLo, 0xffffff, [-0.07, 0.09, 0.38], [0, 0, 0], [0.04, 0.04, 0.04]);
  pb.add(GEO.box, colorB, [0, 0, -0.55], [0, 0, 0], [0.12, 0.03, 0.6]);
  const body = pb.build(VC_TOON, OUTLINE_THIN, false);
  grp.add(body);
  const wings = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(0.12 * s, 0.04, 0.02);
    const wb = new PartBuilder();
    wb.add(GEO.box, colorA, [0.32 * s, 0, 0], [0, 0, 0], [0.62, 0.03, 0.3]);
    wb.add(GEO.box, colorB, [0.52 * s, -0.005, -0.06], [0, 0, 0], [0.32, 0.03, 0.26]);
    piv.add(wb.build(VC_TOON, OUTLINE_THIN, false));
    grp.add(piv); wings.push(piv);
  }
  grp.userData.wings = wings;
  grp.scale.setScalar(1.6);
  return grp;
}
function buildBirds() {
  const combos = [[0xe8282b, 0x1e5fd6], [0x1e8be0, 0xffc21a], [0x24b24b, 0xe8282b]];
  for (let i = 0; i < 5; i++) {
    const [a, b] = combos[i % 3];
    const m = makeMacaw(a, b);
    m.userData.ph = rand(0, TAU); m.userData.r = rand(55, 90); m.userData.h = rand(22, 38); m.userData.sp = rand(0.07, 0.11) * (i % 2 ? 1 : -1);
    m.userData.cx = rand(-20, 20); m.userData.cz = rand(-60, -30);
    scene.add(m); World.birds.push(m);
  }
}

function updateWorld(dt, t) {
  World.time = t;
  for (const m of World.grassMats) m.userData.time.value = t;
  for (const m of World.clothMats) m.userData.time.value = t;
  if (World.motes) World.motes.uniforms.t.value = t;
  if (World.clouds) for (const c of World.clouds.children) { c.position.x += c.userData.speed * dt; if (c.position.x > 800) c.position.x = -800; }
  for (const b of World.birds) {
    const u = b.userData; u.ph += u.sp * dt * 3;
    const x = u.cx + Math.cos(u.ph) * u.r, z = u.cz + Math.sin(u.ph) * u.r * 0.6, y = u.h + Math.sin(u.ph * 3) * 3;
    const nx = u.cx + Math.cos(u.ph + 0.01 * Math.sign(u.sp)) * u.r, nz = u.cz + Math.sin(u.ph + 0.01 * Math.sign(u.sp)) * u.r * 0.6;
    b.position.set(x, y, z); b.lookAt(nx, y, nz);
    const f = Math.sin(t * 9 + u.ph * 5) * 0.7;
    u.wings[0].rotation.z = f; u.wings[1].rotation.z = -f;
  }
}

// Soporte de instancing en el contorno
OUTLINE_MAT.vertexShader = OUTLINE_MAT.vertexShader.replace(
  'vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);',
  `#ifdef USE_INSTANCING
      vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(transformed, 1.0);
    #else
      vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);
    #endif`);
for (const m of [OUTLINE_THIN, OUTLINE_MED, OUTLINE_PROP]) { m.vertexShader = OUTLINE_MAT.vertexShader; m.needsUpdate = true; }

function instanced(geo, mat, list, o = {}) {
  const m = new THREE.InstancedMesh(geo, mat, list.length);
  const d = new THREE.Object3D();
  list.forEach((it, i) => {
    d.position.set(it.x, it.y || 0, it.z); d.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
    const s = it.s || 1; d.scale.set(it.sx || s, it.sy || s, it.sz || s); d.updateMatrix();
    m.setMatrixAt(i, d.matrix);
    if (it.c !== undefined) m.setColorAt(i, new THREE.Color(it.c));
  });
  m.castShadow = o.cast ?? true; m.receiveShadow = o.receive ?? true;
  m.instanceMatrix.needsUpdate = true;
  if (o.outline) {
    const ol = new THREE.InstancedMesh(geo, o.outline, list.length);
    for (let i = 0; i < list.length; i++) { m.getMatrixAt(i, d.matrix); ol.setMatrixAt(i, d.matrix); }
    ol.castShadow = false; ol.receiveShadow = false; m.add(ol);
  }
  m.computeBoundingSphere();
  return m;
}

function brickWall(w, h, d = 0.18, painted = null) {
  const geo = new THREE.BoxGeometry(w, h, d);

  const pa = geo.attributes.position, na = geo.attributes.normal;

function makePole(h = 9) {
  const pb = new PartBuilder();
  pb.add(GEO.cyl, 0xa8a49a, [0, h / 2, 0], [0, 0, 0], [0.13, h, 0.13]);
  pb.add(GEO.box, 0x6b6b6b, [0, h - 0.6, 0], [0, 0, 0], [1.8, 0.1, 0.1]);
  pb.add(GEO.cyl, 0x575757, [0.45, h - 1.4, 0.18], [0, 0, 0], [0.22, 0.6, 0.22]);
  for (const sx of [-0.8, -0.3, 0.3, 0.8]) pb.add(GEO.cylLo, 0x3a6e3a, [sx, h - 0.5, 0], [0, 0, 0], [0.03, 0.1, 0.03]);
  return pb.build(VC_TOON, OUTLINE_THIN);
}
function cable(a, b, sag = 0.8, r = 0.018, color = 0x1e1e1e) {
  const pts = [];
  for (let i = 0; i <= 16; i++) {
    const t = i / 16; const p = new V3().lerpVectors(a, b, t); p.y -= Math.sin(t * Math.PI) * sag; pts.push(p);
  }
  const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, r, 4, false);
  const m = new THREE.Mesh(g, toon(color, { rim: false }));
  return m;
}

// ---------- Tendedero con ropa ondeando ----------
function makeClothMat() {
  const m = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: TOON_GRAD, side: THREE.DoubleSide });
  m.userData.time = { value: 0 };
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = m.userData.time;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float hang = 1.0 - uv.y;
        transformed.z += sin(uTime * 3.0 + position.x * 4.0) * 0.12 * hang + sin(uTime * 5.3 + position.x * 9.0) * 0.04 * hang;`);
  };
  World.clothMats.push(m);
  return m;
}
function makeClothesline(len = 6, h = 2.6) {
  const g = new THREE.Group();
  const p1 = makeColumn(h), p2 = makeColumn(h);
  p1.position.set(-len / 2, 0, 0); p2.position.set(len / 2, 0, 0);
  g.add(p1, p2);
  g.add(cable(new V3(-len / 2, h - 0.1, 0), new V3(len / 2, h - 0.1, 0), 0.25, 0.01, 0x777777));
  const pb = new PartBuilder();
  const cols = [0xff5a5a, 0xffd23f, 0x3fa9ff, 0xffffff, 0xff8ad8, 0x7ad36b, 0xff9a3f];
  let x = -len / 2 + 0.5;
  while (x < len / 2 - 0.6) {
    const w = rand(0.4, 0.8), hh = rand(0.5, 0.95);
    const t = (x + len / 2) / len; const y = h - 0.1 - Math.sin(t * Math.PI) * 0.25;
    const pg = new THREE.PlaneGeometry(w, hh, 6, 4);
    pb.add(pg, pick(cols), [x + w / 2, y - hh / 2, 0]);
    x += w + rand(0.1, 0.3);
  }
  const cloth = new THREE.Mesh(mergeGeometries(pb.geos), makeClothMat());
  cloth.castShadow = true;
  g.add(cloth);
  return g;
}

function buildRanchos(spots) {
  // spots: [{x,y,z,w,h,d,ry,painted,color}]
  const painted = spots.filter((s) => s.painted), brick = spots.filter((s) => !s.painted);
  const g = new THREE.Group();
  const mk = (list, tex) => {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const m = instanced(geo, toon(0xffffff, { map: tex, rimMul: 0.6 }), list.map((s) => ({ x: s.x, y: s.y + s.h / 2, z: s.z, ry: s.ry, sx: s.w, sy: s.h, sz: s.d, c: s.color ?? 0xffffff })), { cast: false, outline: OUTLINE_PROP });
    g.add(m);
  };
  if (painted.length) mk(painted, FACADE_TEX);
  if (brick.length) mk(brick, BRICKHOUSE_TEX);
  // techos de zinc
  const roofs = spots.map((s) => ({ x: s.x, y: s.y + s.h + 0.08, z: s.z, ry: s.ry, rx: rand(-0.06, 0.06), sx: s.w + 0.4, sy: 0.12, sz: s.d + 0.4, c: pick([0x8b8f94, 0x9a6b4a, 0x7d8288, 0xa0a4a8, 0x8c5a3c]) }));
  g.add(instanced(new THREE.BoxGeometry(1, 1, 1), toon(0xffffff, { rimMul: 0.5 }), roofs, { cast: false }));
  // tanques de agua azules
  const tanks = spots.filter(() => Math.random() < 0.45).map((s) => ({ x: s.x + rand(-s.w * 0.3, s.w * 0.3), y: s.y + s.h + 0.6, z: s.z + rand(-s.d * 0.3, s.d * 0.3), sx: 0.55, sy: 1.0, sz: 0.55, c: 0x1f6fd1 }));
  if (tanks.length) g.add(instanced(new THREE.CylinderGeometry(1, 0.9, 1, 12), toon(0xffffff), tanks, { cast: false, outline: OUTLINE_PROP }));
  return g;
}

class Char {

    this.root = new THREE.Group();
    this.anim = 'idle'; this.at = 0; this.t = rand(0, 10); this.aopt = {};

    for (const j of JOINTS) { this.cur[j] = { x: 0, y: 0, z: 0, py: 0 }; this.P[j] = { x: 0, y: 0, z: 0, py: 0 }; }
    this.rootY = 0; this.curRootY = 0; this.snapK = 14;

  }
  get height() { return this.B.leg + FOOT_H + this.B.torso + this.B.neck + this.B.head * 2; }
  build() {
    const L = this.look, B = this.B, skin = L.skin;

// ---------- Generador de compañeros de equipo ----------
const SKINS = [0x5c3a26, 0x7a4e32, 0x8f5d3d, 0xa8714b, 0xc08a62, 0xd8a77f, 0xe8c09a];
const HAIRS = [0x16100c, 0x2a1a10, 0x3b2616, 0x1a1a1a, 0x5a3a1e];
// nombres por género y edad (el nombre siempre coincide con el modelo)
const TEAM_NAMES = {
  m: { kid: ['Toñito', 'Pedrito', 'Chiquito', 'Carlitos', 'Juanchito', 'Luisito'], teen: ['Kevin', 'Jhonny', 'Yorman', 'Brayan', 'Maikel', 'Yeferson', 'Deivis'], adult: ['Don Ramón', 'El Gocho', 'Wilmer', 'Ronald', 'Richard', 'El Catire'] },
  f: { kid: ['Yuli', 'Mariángel', 'Génesis', 'Anita', 'Valentina', 'Rosita'], teen: ['Mayerlin', 'Keila', 'Yorgelis', 'Dayana', 'La Flaca', 'Yusleidy'], adult: ['Doña Carmen', 'Neyda', 'Yusmary', 'Andreína', 'La Catira', 'Doña Chela'] },
};
function pickTeamName(look, used, rng) {
  const g = TEAM_NAMES[look.girl ? 'f' : 'm'];
  const order = [look.kind, ...['kid', 'teen', 'adult'].filter((k) => k !== look.kind)];
  for (const k of order) {
    const free = (g[k] || []).filter((n) => !used.has(n));
    if (free.length) { const n = free[Math.floor(rng() * free.length)]; used.add(n); return n; }
  }
  return look.girl ? 'La Chama' : 'El Chamo';
}
function teammateLook(teamIdx, i, rng) {
  const tc = TEAM_COLORS[teamIdx];
  const kinds = ['kid', 'adult', 'teen', 'kid', 'adult', 'teen', 'kid', 'adult'];
  const kind = kinds[i % kinds.length];
  const girl = rng() < 0.35;
  const styles = girl ? ['ponytail', 'braids', 'long', 'curly'] : ['buzz', 'curly', 'spiky', 'afro', 'buzz', 'bald'];
  const hairStyle = styles[Math.floor(rng() * styles.length)];
  const capRoll = rng();
  const shirtStyles = ['tee', 'tank', 'jersey', 'tee'];
  const pantsStyles = kind === 'adult' ? ['long', 'shorts', 'long'] : ['shorts', 'shorts', 'capri'];
  const shoesList = kind === 'kid' ? ['chancletas', 'barefoot', 'sneakers', 'chancletas'] : ['sneakers', 'chancletas', 'sneakers'];
  return {
    kind, girl,
    skin: SKINS[Math.floor(rng() * SKINS.length)], hair: HAIRS[Math.floor(rng() * HAIRS.length)], hairStyle: hairStyle === 'bald' && kind !== 'adult' ? 'buzz' : hairStyle,
    cap: capRoll < 0.45 && hairStyle !== 'afro' ? { color: rng() < 0.6 ? tc.main : tc.alt, back: rng() < 0.4, logo: tc.alt } : null,
    headband: girl && rng() < 0.4 ? pick([0xff4f8b, 0xffd23f, 0x3fd3ff]) : null,
    shirt: rng() < 0.75 ? tc.main : mixc(tc.main, 0xffffff, 0.25), shirtStyle: shirtStyles[Math.floor(rng() * shirtStyles.length)], trim: tc.alt, stripe: rng() < 0.3,
    pants: pick([0x2f3d5c, 0x3d4a66, 0x1f2a40, 0x5a5048, 0x2a5a8a, 0x404040, 0x7a6a50]), pantsStyle: pantsStyles[Math.floor(rng() * pantsStyles.length)],
    shoes: shoesList[Math.floor(rng() * shoesList.length)], shoeColor: pick([0xffffff, 0x2bb3a3, 0xff5a5a, 0x222222, 0xffd23f]),
    mustache: kind === 'adult' && !girl && rng() < 0.4, stubble: kind === 'adult' && !girl && rng() < 0.4, earrings: girl && rng() < 0.6,
    glasses: rng() < 0.1, watch: kind === 'adult' && rng() < 0.4,
  };
}
function captainLook(id, teamIdx) {
  const base = JSON.parse(JSON.stringify(CAPTAINS[id].look));
  const tc = TEAM_COLORS[teamIdx];
  // el capitán mantiene su ropa icónica pero lleva un toque del color del equipo
  if (id === 'brisa') { base.shirt = tc.main; base.trim = tc.alt; }
  if (id === 'cohete') { base.trim = tc.main; base.cap = { color: tc.main, back: true, logo: tc.alt }; }
  if (id === 'chucho') { base.cap = { color: tc.main, back: false, logo: tc.alt }; base.trim = tc.main; base.stripe = false; }

}

// ===================== ESTADIO: tribunas, techo, banderas y público animado en GPU =====================
const BOWL = {
  r0: 13.4, lineOff: 9, tJoin: 10, tEnd: 40, arcA: 93 * Math.PI / 180,
  low: { rows: 12, depth: 0.9, rise: 0.5, base: 1.2, parapet: 1.1 },
  up: { r0: 24.0, a: 70 * Math.PI / 180, rows: 9, depth: 0.95, rise: 0.62, base: 9.8, parapet: 1.2, fascia: 8.0 },
  bl: { gap: 3.0, a0: 0.21, a1: 0.95, rows: 12, depth: 0.85, rise: 0.6, base: 1.8, parapet: 1.0 },
};
function rowsH(d, o) {
  if (d < 0) return 0;
  const D = o.rows * o.depth;
  if (d > D + 0.35) return 0;
  if (d >= D) return o.base + (o.rows - 1) * o.rise + o.parapet;
  return o.base + Math.floor(d / o.depth) * o.rise + 0.85;
}
// ¿el punto está del lado del campo respecto al borde de la grada baja?
function insideBowl(x, z) {
  const b = Math.atan2(x, z);
  if (Math.abs(b) <= BOWL.arcA) return Math.hypot(x, z) < BOWL.r0;
  const s = Math.sign(x) || 1, t = 0.7071 * (s * x - z), o = 0.7071 * (s * x + z);
  return t < BOWL.tJoin - 0.5 || o < BOWL.lineOff || t > BOWL.tEnd + 2;
}
// altura de la superficie de gradas/estructuras en (x,z); 0 si ahí no hay nada
function estadioStandH(x, z) {
  const F = FIELDS.estadio.fence;
  const r = Math.hypot(x, z), b = Math.atan2(x, z);
  let d = -1;
  if (Math.abs(b) <= BOWL.arcA) d = r - BOWL.r0;
  else { const s = Math.sign(x) || 1, t = 0.7071 * (s * x - z), o = 0.7071 * (s * x + z); if (t >= BOWL.tJoin - 0.5 && t <= BOWL.tEnd) d = o - BOWL.lineOff; }
  let h = rowsH(d, BOWL.low);
  if (Math.abs(b) <= BOWL.up.a) { const d2 = r - BOWL.up.r0; h = Math.max(h, d2 >= -0.4 && d2 < 0 ? BOWL.up.base : rowsH(d2, BOWL.up)); }
  const a = Math.atan2(x, -z), aa = Math.abs(a);
  if (z < 0 && aa >= BOWL.bl.a0 && aa <= BOWL.bl.a1) h = Math.max(h, rowsH(r - (fenceR(F, a) + BOWL.bl.gap), BOWL.bl));
  const rc = fenceR(F, 0);
  if (Math.abs(x) < 7.6 && z < -(rc + 3.0) && z > -(rc + 3.8)) h = Math.max(h, 6.5);
  if (Math.abs(x) < 8.8 && Math.abs(z + rc + 11) < 0.6) h = Math.max(h, 19.4);
  return h;
}

// ---------- caminos (borde interior de cada grada) ----------
function frameOf(path, ref) {
  const n = path.length, seg = [];
  for (let k = 0; k < n - 1; k++) {
    const tx = path[k + 1].x - path[k].x, tz = path[k + 1].z - path[k].z, l = Math.hypot(tx, tz) || 1;
    let nx = -tz / l, nz = tx / l;
    const mx = (path[k].x + path[k + 1].x) / 2 - ref.x, mz = (path[k].z + path[k + 1].z) / 2 - ref.z;
    if (nx * mx + nz * mz < 0) { nx = -nx; nz = -nz; }
    seg.push({ x: nx, z: nz, tx: tx / l, tz: tz / l, l });
  }
  const out = [], un = [];
  for (let k = 0; k < n; k++) {
    const a = seg[Math.max(0, k - 1)], b = seg[Math.min(n - 2, k)];
    let mx = a.x + b.x, mz = a.z + b.z; const ml = Math.hypot(mx, mz) || 1; mx /= ml; mz /= ml;
    const c = Math.max(0.5, mx * b.x + mz * b.z);
    un.push({ x: mx, z: mz }); out.push({ x: mx / c, z: mz / c });
  }
  return { path, seg, out, un, aisle: [], sec: [], tag: [] };
}

// ---------- equipos ----------

  for (let ti = 0; ti < 2; ti++) {

    const cap = new Char(captainLook(p.cap, ti), { number: [7, 23, 99][['cohete', 'brisa', 'chucho'].indexOf(p.cap)] });
    cap.isCaptain = true; cap.team = ti; cap.dispName = p.name; cap.capId = p.cap;

  D.fielders.push(pf);

    f.char.setAnim(f.role === 'C' ? 'squat' : f.role === 'P' ? 'pitchReady' : 'ready');

  D.mates.forEach((m) => { m.onBench = false; }); D.captain.onBench = false;

  for (let k = 0; k < L.length; k++) {
    const i = ((T.order || 0) + k) % L.length;

}

    const s = seatFor(teamIdx, Math.min(k, 6));

    m.root.position.set(s.x + (standing ? 0.6 : 0), 0, s.z + (standing ? 0.9 : 0));

// ---------- ciclo de lanzamiento ----------
function toPrePitch() {

function leadoff(r) {

function startPitch(type) {
  const p = pitcherF();

  const dur = 1.0;
  if (!p.char.pitchStyle) p.char.pitchStyle = { cohete: 'rapida', brisa: 'recta', chucho: 'curva' }[p.char.capId] || pick(['recta', 'curva', 'rapida']);
  G.pitch = { type, dur, t: 0, released: false, swingAt: -1, contactDone: false, resolved: false, pitchT: 0, curveDir: Math.random() < 0.5 ? -1 : 1 };
  G.state = 'windup'; G.stateT = 0;
  p.char.setAnim('pitch', { type: p.char.pitchStyle, dur }, 26);
  // quick time event: zona verde más ancha con más efecto; la rápida es la más exigente

  const human = !defPlayer().cpu;
  const tm = type === 'rapida' ? (human ? 0.82 : 0.72) : type === 'curva' ? (human ? 0.92 : 0.88) : 1;
  // la zona varía un poco en cada lanzamiento para que su tamaño no delate el tipo
  const hw = (human ? (0.13 + st.spin * 0.015) * tm : (0.1 + st.spin * 0.013) * tm) * rand(0.88, 1.12);
  const q = { id: Math.random(), c: human ? rand(0.36, 0.64) : rand(0.42, 0.72), hw, sw: hw * (human ? 0.38 : 0.32), m: 0, res: null,
    human, passes: 0, maxPasses: 4, phase: 0, passT: 0.76, holdU: 0.46, holding: false, expired: false };
  if (defPlayer().cpu) {

    const pPerf = D.qte[0] * (0.7 + st.spin * 0.1), pGood = D.qte[1] + D.qte[0] - pPerf + (st.spin - 3) * 0.03;
    if (r < pPerf) q.cpuAt = q.c + rand(-0.7, 0.7) * q.sw;
    else if (r < pPerf + pGood) q.cpuAt = q.c + (Math.random() < 0.5 ? -1 : 1) * rand(q.sw * 1.15, q.hw * 0.92);

}
// lo que se VE del QTE: la bola a propósito se disfraza de "¡CLAVADA!" (q.look) aunque sea bola (q.res)
function qteFx(q) {
  const p = pitcherF(), hand = p.char.worldHand('R', new V3());
  const look = q.look || q.res;
  const col = look === 'perfect' ? 0xffd23f : look === 'good' ? 0x45c46a : 0xff4a2e;
  FX.glowBurst(hand, look === 'perfect' ? 22 : 10, col, 0.35, 3, 0.4);
  SFX.qte(look);

}
function maybeCpuSteal() {

  const legs = batterStats().legs;
  if (r1 && !G.bases[1] && Math.random() < 0.1 + legs * 0.035 && G.outs < 2) callSteal();

  }

    const lead = G.bases.filter(Boolean).find((r) => r.stealing);
    UI.popWorld('¡ROBO!', lead.char.root.position.clone().add(new V3(0, 2.2, 0)), { color: '#ffd23f' });

function releasePitch() {

  TIMING.visible = true;

  TIMING.position.set(plan.target.x, plan.target.y, 0.02);

    const W = swingWindows(batterStats(), P.type);

    if (Math.random() < swingP) {

const CONTACT_T = 0.12;

function updatePitchFlight(dt) {

  P.t += dt;

  if (humanBat && pk(G.half, 'up')) doSwing();
  if (!humanBat && P.cpuSwingAt !== undefined && P.swingAt < 0 && P.t >= P.cpuSwingAt) doSwing();
  const W = swingWindows(batterStats(), P.type);
  const e = P.swingAt >= 0 ? P.swingAt + CONTACT_T - plan.T : 0;
  const pending = P.swingAt >= 0 && !P.contactDone && Math.abs(e) <= W.ok + 0.0001;

    const v = plan.vel(plan.T, new V3());
    const extra = P.t - plan.T;
    pos.addScaledVector(v, extra);
    if (pending && pos.z > 0.85) pos.z = 0.85; // espera al swing tardío

  FX.sparkle(pos, PITCH_NEUTRAL, 1, 0.04);

  const k = clamp(1 - P.t / plan.T, 0, 1);
  const outer = TIMING.userData.outer;
  const s = 0.17 + k * 1.15;
  outer.scale.setScalar(s); outer.material.opacity = 0.35 + 0.65 * (1 - k);
  TIMING.quaternion.copy(camera.quaternion);
  TIMING.userData.inner.material.opacity = k < 0.12 ? 1 : 0.7;

  if (P.swingAt >= 0 && !P.contactDone) {
    const contactTime = e < 0 ? plan.T : plan.T + e;
    if (pending) {

        const cp = plan.pos(plan.T, new V3());

}

        if (play.idleT > 2.6 && play.landed) { const ax = tgt.x - p.x, az = tgt.z - p.z, l = Math.hypot(ax, az); if (l > 0.3) _mv.set(ax / l * 0.7, 0, az / l * 0.7); }

// ---------- foul ----------

// ---------- jugada de robo (sin contacto) ----------
function beginPlayForSteal(C, lead) {
  (G.outcomes = G.outcomes || []).push({ team: G.half, cap: offPlayer().cap, r: 'SBA' });
  const runners = G.bases.filter(Boolean);
  const play = {
    sim: null, t: 0, ball: { state: 'held', holder: C, delay: 0.0, decided: true }, chaser: C, runners, outs: 0, runs: 0, landed: true, ended: false, endT: 0,
    steal: true, cover: {}, humanDef: false, humanOff: false, events: [],
  };
  G.play = play; G.state = 'play';
  assignCoversSteal(play);
  const recv = play.cover[lead.to] || fielderByRole('SS');
  // no hay catcher: el lanzador saca otra chapa de la caja y tira a la base
  CHAPA.visible = true; CHAPA.scale.setScalar(1.35);

}
function assignCoversSteal(play) {
  const ff = fielders(); const P = fielderByRole('P'); const used = new Set([P]);
  play.cover = {};
  for (const base of [2, 3, 1]) for (const role of COVER[base]) { const f = ff.find((x) => x.role === role); if (f && !used.has(f)) { play.cover[base] = f; used.add(f); f.coverBase = base; break; } }
}

// ---------- base por bolas ----------
function walkBatter() {
  const br = makeRunner(batter(), 0, true); br.to = 1; br.state = 'run'; br.walkTo = 1; br.speed = 7; br.delay = 0.2;
  const runners = [br];
  // forzados
  let forcedUpTo = 1;
  for (let i = 0; i < 3; i++) { if (G.bases[i] && forcedUpTo === i + 1) forcedUpTo = i + 2; else break; }
  G.bases.forEach((r, i) => {
    if (!r) return;
    r.from = i + 1; r.prog = 0;
    if (i + 1 < forcedUpTo) { r.to = i + 2; r.walkTo = i + 2; r.state = 'run'; r.speed = Math.max(r.speed, 6); }
    else { r.to = i + 1; r.walkTo = i + 1; r.state = 'onbase'; }
    runners.push(r);
  });
  G.play = { sim: null, t: 0, ball: { state: 'dead' }, runners, outs: 0, runs: 0, landed: true, ended: false, endT: 0, walk: true, events: [], chaser: null, cover: {} };
  G.state = 'play';
  BAT.userData.drop = true;
  dropBat(false);
}

// ---------- bate que sale volando ----------
function dropBat(big) {
  if (BAT.userData.free) return;
  const wp = new V3(), wq = new THREE.Quaternion();
  BAT.getWorldPosition(wp); BAT.getWorldQuaternion(wq);
  scene.attach(BAT);
  BAT.position.copy(wp); BAT.quaternion.copy(wq);
  BAT.userData.free = true;
  BAT.userData.vel = big ? new V3(rand(-1, 1), 8.5, rand(1, 2)) : new V3(rand(0.5, 2), rand(2, 3.5), rand(0.5, 1.5));
  BAT.userData.spin = big ? new V3(rand(8, 14), rand(-3, 3), rand(-10, 10)) : new V3(rand(-6, 6), rand(-3, 3), rand(-8, 8));
  BAT.userData.bounces = 0;
  if (big) { UI.popWorld('¡BAT FLIP!', wp.clone().add(new V3(0, 2, 0)), { size: 'sm', color: '#ffd23f' }); }
}
function updateBat(dt) {
  if (!BAT.userData.free) return;
  const u = BAT.userData;
  if (u.rest) return;
  u.vel.y -= 14 * dt;
  BAT.position.addScaledVector(u.vel, dt);
  BAT.rotation.x += u.spin.x * dt; BAT.rotation.y += u.spin.y * dt; BAT.rotation.z += u.spin.z * dt;
  if (BAT.position.y < 0.05) {
    BAT.position.y = 0.05;
    if (Math.abs(u.vel.y) > 1.5 && u.bounces < 3) { u.vel.y *= -0.35; u.vel.x *= 0.5; u.vel.z *= 0.5; u.spin.multiplyScalar(0.5); u.bounces++; SFX.batDrop(); FX.dust(BAT.position, 4, 0.5); }
    else { u.rest = true; BAT.rotation.x = Math.PI / 2; BAT.rotation.z = 0; BAT.position.y = 0.03; }
  }
}

// ---------- final de jugada ----------
function finalizePlay() {
  const play = G.play;
  G.outs += play.outs;
  // los que quedan en base
  const onb = [null, null, null];
  for (const r of play.runners) {
    if (r.state === 'onbase' || r.state === 'frozen' || r.state === 'hold' || r.state === 'return') {
      const b = r.state === 'onbase' ? r.from : r.from;
      if (b >= 1 && b <= 3 && G.outs < 3) { if (!onb[b - 1]) onb[b - 1] = r; else onb[Math.min(2, b)] = r; }
    }
  }
  // resultado del bateador
  const br = play.batterRunner;
  if (br && !play.steal && !play.walk) {
    const reached = br.state === 'scored' ? 4 : br.state === 'onbase' ? br.from : 0;
    (G.outcomes = G.outcomes || []).push({ team: G.half, cap: offPlayer().cap, r: play.error ? 'E' : reached === 0 ? (play.caught ? 'FO' : 'GO') : ['', '1B', '2B', '3B', play.hr ? 'HR' : 'IHR'][reached], launch: Math.round(play.res ? play.res.launch : 0), dist: play.landPt ? Math.round(Math.hypot(play.landPt.x, play.landPt.z)) : 0, grade: play.res ? play.res.grade : '', ci: play.catchInfo });
  }
  if (br && !play.steal && !play.walk) {
    const reached = br.state === 'scored' ? 4 : br.state === 'onbase' ? br.from : 0;
    if (reached > 0 && !play.error) {
      G.hits[G.half]++; G.stats[G.half].h++; G.stats[G.half].ab++;
      G.stats[G.half].rbi += play.runs;
      const names = ['', '¡SENCILLO!', '¡DOBLE!', '¡TRIPLE!', '¡JONRÓN!'];
      if (reached === 4) { G.stats[G.half].hr++; if (!play.hr) { UI.bigBanner('¡JONRÓN!', 'Dentro del parque, ¡qué carrerita!', { burst: true, ms: 2200 }); SFX.jonron(); } }
      else if (reached >= 2) { UI.bigBanner(names[reached], `${offPlayer().name} llega a ${['', 'primera', 'segunda', 'tercera'][reached]}`, { ms: 1500, cls: 'white' }); SFX.crowd(0.8, 2); SFX.say(names[reached].replace(/¡|!/g, '') + '!'); }
      else { UI.popWorld('¡HIT!', BASE_V[1].clone().add(new V3(0, 2.6, 0)), { size: 'lg', color: '#ffd23f' }); SFX.say(pick(['¡Hit!', '¡Sencillo!', '¡Se embasó!'])); }
    } else if (reached > 0 && play.error) {
      G.stats[G.half].ab++;
      UI.toast('Se embasó por error');
    }
  }
  if (play.steal) {
    for (const r of play.runners) if (r.state === 'onbase' && r.stealing === false && r.from >= 2) { G.stats[G.half].sb++; }
  }
  G.bases = onb;
  for (const r of G.bases) if (r) { r.stealing = false; r.isBatter = false; r.trot = false; r.state = 'onbase'; r.to = r.from; }
  // limpiar fuera de base
  for (const r of play.runners) {
  }
  UI.updateBoard(G); drawScoreboard(G.env.scoreboard, G);
  G.closeCam = null;
  // ¿se acabó el juego por walk-off?
  if (checkWalkOff()) return;
  const wasSteal = play.steal;
  G.play = null;
  if (G.outs >= 3) return endHalf();
  if (wasSteal && G.called) {
    const c = G.called; G.called = null; c.steals = [];
    if (c.outcome === 'k') { addOut(); if (G.outs >= 3) return endHalf(); return nextBatter(); }
    if (c.outcome === 'bb') return walkBatter();
    return toPrePitch();
  }
  nextBatter();
}
function addOut() { G.outs++; UI.updateCount(G); }
function nextBatter() {
  G.balls = 0; G.strikes = 0;
  // el que bateó se queda corriendo en base; entra el siguiente del orden (con las stats del capitán)
  const T = G.teams[G.half];
  const prev = T.atBat;
  T.atBat = nextInOrder(T);
  if (prev && prev !== T.atBat) prev.lookTarget = null;
  seatBench(G.half);
  placeBatter();
  const b = batter();
  FX.dust(b.root.position, 10, 0.8);
  if (b !== T.captain) UI.popWorld(`Al bate: ${b.dispName}`, b.root.position.clone().add(new V3(0.3, b.height + 0.7, 0)), { size: 'sm', color: '#ffffff', dur: 1.6 });
  UI.updateBoard(G);
